name: release

# Images are built ONLY from a tag, never from a branch: a tag is the statement
# "this commit is a release", and an image tagged `latest` that nobody decided to
# publish is worse than no image at all.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # QEMU + buildx so the image is multi-arch without a second runner. The
      # extension image is pure Go, so arm64 costs almost nothing to add.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN is scoped to this repository and expires with the job:
          # no long-lived registry credential exists anywhere.
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derive the tags from the git ref. `latest` follows the highest semver tag
      # only, so a v0.x pre-release does not silently become the default.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          # The Dockerfile carries no proxy or mirror; the build cache is what
          # makes repeat builds fast, and it lives in the registry rather than in
          # an environment-specific daemon.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
