name: release

# Images are built ONLY from a tag, never from a branch: a tag is the statement
# "this commit is a release", and an image tagged `latest` that nobody decided to
# publish is worse than no image at all.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  # One job PER ARCHITECTURE, each on a runner of that architecture.
  #
  # This used to be a single job with `platforms: linux/amd64,linux/arm64` under QEMU. Emulation is
  # 5-20x slower than native for anything CPU-bound, and the arm64 half of this image is built by
  # real arm64 hardware on GitHub's runners — so there was never anything to emulate.
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # No setup-qemu: there is nothing to emulate. buildx is still needed for the push-by-digest
      # flow that lets the two architectures be assembled into one manifest afterwards.
      - uses: docker/setup-buildx-action@v3

      - name: log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed BY DIGEST, not by tag. Two jobs writing the same tag would race, and whichever
      # finished last would silently replace the other's architecture with a single-platform image.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          # Scoped per architecture: a cache written by the arm64 runner is useless to the amd64 one.
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          provenance: true
          sbom: true

      - name: record the digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
          echo "built ${{ matrix.platform }} -> $digest"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Assemble the per-architecture digests into ONE multi-arch manifest, and apply the tags there.
  #
  # Tagging here rather than in the build jobs is what makes a tag point at a COMPLETE image:
  # applying it earlier would briefly publish a tag resolving to a single architecture.
  merge:
    runs-on: ubuntu-24.04
    needs: image
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: create the manifest
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}

      - name: verify both architectures are present
        run: |
          set -euo pipefail
          # `imagetools inspect` prints a table of the manifest's entries; counting the two
          # platform lines is enough and needs no jq schema knowledge.
          # A merge that silently produced a single-arch manifest would still exit 0, so the result
          # is checked rather than assumed — this is the failure mode the whole split can introduce.
          #
          # Matched by PLATFORM NAME, not by number of entries: `provenance` and `sbom` each add an
          # `unknown/unknown` attestation manifest, so a correct multi-arch image lists FOUR entries.
          # An equality check on the count fails on a perfectly good image, which is what it did.
          first_tag="$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
          docker buildx imagetools inspect "$first_tag"
          got="$(docker buildx imagetools inspect "$first_tag" \
            | grep -oE '^ +Platform: +linux/[a-z0-9]+' | awk '{print $2}' | sort -u | tr '\n' ' ')"
          for want in linux/amd64 linux/arm64; do
            case " $got " in
              *" $want "*) ;;
              *) echo "::error::$first_tag is missing $want (has: ${got:-none})"; exit 1 ;;
            esac
          done
          echo "both architectures present in $first_tag: $got"
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
