id: bundled
version: 0.1.1
lifecycle: [deleted]

tools:
  # ---- memory / history / file / vision (from memory-extension) ----
  - name: todo-write
    description: Replace the session's todo list (stored in the database, not a file).
    descriptions:
      zh: 替换会话的待办列表（存于数据库，而非文件）。
    input_schema:
      type: object
      properties:
        todos:
          type: array
          description: The full todo list to replace the session current one.
          descriptions:
            zh: 替换会话当前列表的完整待办列表。
          items:
            type: object
            properties:
              content:
                type: string
                description: Todo item text.
                descriptions:
                  zh: 待办项文本。
              status:
                type: string
                enum: [pending, in_progress, completed, cancelled]
                description: Todo status.
                descriptions:
                  zh: 待办状态。
              priority:
                type: string
                enum: [high, medium, low]
                description: Todo priority.
                descriptions:
                  zh: 待办优先级。
            required: [content, status, priority]
      required: [todos]

  - name: history-search
    description: >-
      Search a conversation's chat history by keyword. Matches are case-insensitive substrings.
      WHICH CONTENT IS SEARCHED IS EXPLICIT: `include` defaults to ["text"] — the messages' own
      prose — so a long tool log cannot drown the conversational hits. Add "tool" to match tool
      names and their arguments, and "result" to match tool OUTPUT. Searches the WHOLE conversation
      (no cap), newest-first, and returns one page [offset, offset+limit). Each entry's content is
      cut to `preview_chars` (default 2000) and marked `truncated` with `full_chars`; call
      "history-read" with that entry's `seq` to get the rest.
      Pass `session` to search ANOTHER conversation in the same tenant (empty = this one).
    descriptions:
      zh: >-
        按关键词搜索会话历史（大小写不敏感子串）。搜索范围是显式的：`include` 默认 ["text"]
        （消息自身的文本），避免长工具日志淹没对话命中；加 "tool" 匹配工具名与调用参数，加 "result"
        匹配工具输出。搜索整条链（无深度上限），最新在前，返回 [offset, offset+limit) 一页。每条内容按
        `preview_chars`（默认 2000）截断并标记 `truncated` 与 `full_chars`；用该条 `seq` 调
        "history-read" 取剩余部分。传 `session` 可搜索同租户下的另一个会话（留空 = 本会话）。
    input_schema:
      type: object
      properties:
        query:
          type: string
          description: Case-insensitive keyword matched against the selected content kinds.
          descriptions:
            zh: 不区分大小写的关键词，在选定的内容类型中匹配。
        include:
          type: array
          items:
            type: string
            enum: [text, tool, result]
          description: >-
            Content kinds to search. Default ["text"]. "tool" matches tool names and call
            arguments; "result" matches tool output (often large — include it deliberately).
          descriptions:
            zh: >-
              要搜索的内容类型。默认 ["text"]。"tool" 匹配工具名与调用参数；"result" 匹配工具输出
              （通常很大，请有意地开启）。
        session:
          type: string
          description: >-
            Conversation to search. Empty = this session. Another name must exist in the same
            tenant; an unknown name is an error, not an empty result.
          descriptions:
            zh: >-
              要搜索的会话。留空 = 本会话。其他名字必须存在于同一租户；未知名字会报错而不是返回空结果。
        from:
          type: string
          description: "Inclusive lower TIME bound (YYYY-MM-DD HH:MM:SS)."
          descriptions:
            zh: "含端点的下界时间（YYYY-MM-DD HH:MM:SS）。"
        to:
          type: string
          description: "Inclusive upper TIME bound (YYYY-MM-DD HH:MM:SS)."
          descriptions:
            zh: "含端点的上界时间（YYYY-MM-DD HH:MM:SS）。"
        offset:
          type: integer
          description: >-
            Pagination offset into the match list (default 0). Pairs with `limit`; the response
            reports `has_more` and `next_offset`.
          descriptions:
            zh: 匹配结果的分页偏移（默认 0）。与 `limit` 搭配；返回 `has_more` 与 `next_offset`。
        limit:
          type: integer
          description: >-
            Page size: maximum number of matched messages to return (default 50; 0 = no page cap).
          descriptions:
            zh: 页大小：最多返回的匹配消息数（默认 50；0 = 不分页）。
        preview_chars:
          type: integer
          description: >-
            Maximum characters of content per entry (default 2000; 0 = no limit). A cut entry is
            marked `truncated` and reports `full_chars`, and history-read returns the rest.
          descriptions:
            zh: >-
              每条内容的字符上限（默认 2000；0 = 不限）。被截断的条目会标记 `truncated` 并给出
              `full_chars`，可用 history-read 取剩余内容。
        max_total_chars:
          type: integer
          description: >-
            Total budget for the rendered text (default 100000; 0 = unlimited). Entries accumulate;
            a single entry is never cut by THIS budget. `preview_chars` is the per-entry limit.
          descriptions:
            zh: >-
              text 渲染的总字符预算（默认 100000；0 = 不限）。逐条累加；单条不会被本预算截断。
              单条上限由 `preview_chars` 控制。
      required: [query]

  - name: history-range-read
    description: >-
      Read a conversation's history by POSITION. `from_seq`/`to_seq` bound the window by each
      message's position in the chain: the oldest message is 1 and a message's number NEVER CHANGES,
      so a position you saved last turn still addresses the same message this turn. Use `last` for
      "the most recent N" (a seq window cannot ask that without knowing the count). Returns
      oldest-first with seq, id, role, content and tool names. `preview_chars` cuts each entry
      (default 2000, 0 = no limit) and marks it `truncated`; call "history-read" with the entry's
      `seq` for the rest. The response reports `seq_min`/`seq_max` so you can page without guessing.
      Pass `session` to read another conversation in the same tenant.
    descriptions:
      zh: >-
        按位置读取会话历史。`from_seq`/`to_seq` 按消息在链中的位置限定窗口：最旧一条是 1，且一条消息的编号
        永不改变——上一轮记下的位置这一轮仍指向同一条消息。要「最近 N 条」用 `last`（seq 窗口无法在不知道
        总数的情况下表达它）。返回最旧在前，含 seq、id、角色、内容与工具名。`preview_chars` 截断每条
        （默认 2000，0 = 不限）并标记 `truncated`；用该条 `seq` 调 "history-read" 取剩余部分。返回中包含
        `seq_min`/`seq_max`，便于翻页。传 `session` 可读取同租户下的另一个会话。
    input_schema:
      type: object
      properties:
        from_seq:
          type: integer
          description: >-
            Inclusive lower bound on the message's position (oldest = 1). Omit to start at the
            beginning.
          descriptions:
            zh: 消息位置的含端点下界（最旧 = 1）。省略则从头开始。
        to_seq:
          type: integer
          description: >-
            EXCLUSIVE upper bound on position. Omit (or 0) for no upper bound.
          descriptions:
            zh: 位置的**不含端点**上界。省略（或 0）则不限上界。
        last:
          type: integer
          description: >-
            Keep only the newest N messages of the window. This is how "the most recent N" is
            expressed; a seq window cannot, because it needs the count first.
          descriptions:
            zh: 只保留窗口中最新的 N 条。这是表达「最近 N 条」的方式；seq 窗口做不到，因为它需要先知道总数。
        include:
          type: array
          items:
            type: string
            enum: [text, tool, result]
          description: >-
            Content kinds to RENDER. Default ["text"]. "tool" adds call names and arguments;
            "result" adds tool output.
          descriptions:
            zh: >-
              要渲染的内容类型。默认 ["text"]。"tool" 追加调用名与参数；"result" 追加工具输出。
        session:
          type: string
          description: Conversation to read. Empty = this session.
          descriptions:
            zh: 要读取的会话。留空 = 本会话。
        limit:
          type: integer
          description: >-
            Maximum number of messages to RETURN (default 200; 0 = no cap). Does not bound how far
            back the walk goes.
          descriptions:
            zh: 最多返回的消息数（默认 200；0 = 不限）。不限制向前回溯的范围。
        preview_chars:
          type: integer
          description: >-
            Maximum characters of content per entry (default 2000; 0 = no limit).
          descriptions:
            zh: 每条内容的字符上限（默认 2000；0 = 不限）。
        max_total_chars:
          type: integer
          description: >-
            Total budget for the rendered text (default 100000; 0 = unlimited).
          descriptions:
            zh: text 渲染的总字符预算（默认 100000；0 = 不限）。

  - name: history-read
    description: >-
      Return ONE message from a conversation in FULL, by its `seq` position — the number the other
      history tools print as `[seq N]`. This is the other half of the truncation they apply: when an
      entry says `truncated`, pass its seq here. `part` selects what to return — "text" (the
      message's own prose), "tool" (call names and arguments), "result" (tool output only) — and
      omitting it returns everything. Output is never truncated. Pass `session` when the seq came
      from another conversation.
    descriptions:
      zh: >-
        按 `seq` 位置返回会话中某条消息的完整内容——即其他历史工具输出里的 `[seq N]`。这是它们所做
        截断的另一半：当条目标记 `truncated` 时，把它的 seq 传进来。`part` 选择返回内容——"text"
        （消息自身文本）、"tool"（调用名与参数）、"result"（仅工具输出）——省略则返回全部。输出永不
        截断。若 seq 来自另一个会话，请传 `session`。
    input_schema:
      type: object
      properties:
        seq:
          type: integer
          description: >-
            The message's position in the conversation (oldest = 1), as printed by the other history
            tools.
          descriptions:
            zh: 消息在会话中的位置（最旧 = 1），即其他历史工具打印的值。
        part:
          type: string
          enum: [text, tool, result]
          description: >-
            Which part to return. Omit for everything.
          descriptions:
            zh: 返回哪一部分。省略则返回全部。
        session:
          type: string
          description: Conversation the seq belongs to. Empty = this session.
          descriptions:
            zh: seq 所属的会话。留空 = 本会话。
      required: [seq]

  - name: file-info
    description: >-
      Return metadata (name, mime type, size, sha256) for a previously uploaded file
      referenced as file:<code>. Use this first to learn a file's type and size before
      deciding to read or analyze it.
    descriptions:
      zh: >-
        返回以 file:<code> 引用的已上传文件元数据（名称、mime、大小、sha256）。先调用它以了解文件类型与大小，再决定读取或分析。
    input_schema:
      type: object
      properties:
        code:
          type: string
          description: "The file code (the 16-char segment after file:)."
          descriptions:
            zh: "文件编码（file: 之后的 16 字符部分）。"
      required: [code]

  - name: file-read
    description: >-
      Read the TEXT content of a previously uploaded file referenced as file:<code>,
      line-numbered, windowed by offset/limit. Only plain-text formats are supported
      (text/*, markdown, json, csv, code, …); binary files and Office documents
      (docx/xlsx/pptx) are rejected. Use file-info first to check the type.
    descriptions:
      zh: >-
        读取以 file:<code> 引用的已上传文件的文本内容，带行号，用 offset/limit 分窗。仅支持纯文本格式
        （text/*、markdown、json、csv、代码等）；二进制文件与 Office 文档（docx/xlsx/pptx）会被拒绝。先用
        file-info 查看类型。
    input_schema:
      type: object
      properties:
        code:
          type: string
          description: "The file code (the 16-char segment after file:)."
          descriptions:
            zh: "文件编码（file: 之后的 16 字符部分）。"
        offset:
          type: integer
          description: "Start line (0-based, default 0)."
          descriptions:
            zh: "起始行（从 0 开始，默认 0）。"
        limit:
          type: integer
          description: "Maximum lines to return (default 200, max 1000)."
          descriptions:
            zh: "最多返回行数（默认 200，最大 1000）。"
      required: [code]

  - name: image-read
    description: >-
      Understand a previously uploaded image referenced as file:<code> using a vision model.
      Pass a question (prompt); the model returns a natural-language description/answer
      about the image. The image is downscaled before sending.
    descriptions:
      zh: >-
        使用视觉模型理解以 file:<code> 引用的已上传图片。传入问题（prompt）；模型返回对图片的自然语言描述/回答。发送前会先缩小图片。
    input_schema:
      type: object
      properties:
        code:
          type: string
          description: "The file code (the 16-char segment after file:)."
          descriptions:
            zh: "文件编码（file: 之后的 16 字符部分）。"
        prompt:
          type: string
          description: "Question about the image (default: describe it in detail)."
          descriptions:
            zh: 关于图像的问题（默认：详细描述该图像）。
      required: [code]
    required_config: [model.text]

  # ---- audio-transcribe (ASR) ----
  - name: audio-transcribe
    description: >-
      Transcribe a previously uploaded audio file referenced as file:<code> to
      text, using the configured transcription model (config `model.transcription`, a
      provider_id/model_id registered on the agent with
      capability=transcription, e.g. the abcp gateway's qwen3-asr). The
      language is auto-detected.
    descriptions:
      zh: >-
        将以 file:<code> 引用的已上传音频文件转写为文字，使用已配置的转写模型（配置
        model.transcription，为 agent 上注册的 capability=transcription 的
        provider_id/model_id，如 abcp 网关的 qwen3-asr）。语言自动检测。
    input_schema:
      type: object
      properties:
        code:
          type: string
          description: "The file code (the 16-char segment after file:) of the audio file."
          descriptions:
            zh: "音频文件的文件编码（file: 之后的 16 字符部分）。"
      required: [code]
    required_config: [model.transcription]

  # ---- web-search ----
  - name: web-search
    description: >-
      Search the web and return titles, URLs and excerpts. Use this for current information beyond
      your knowledge cutoff. The current year is 2026; use this year when searching for recent
      information or current events.
      Several backends are tried in order and the response names which one answered; if a backend
      failed, the result says so — a partially covered search is reported as partial rather than
      presented as complete.
    descriptions:
      zh: >-
        搜索网页并返回标题、URL 与摘要。用于获取超出知识截止时间的最新信息。当前年份为 2026，搜索近期信息或
        时事时请使用此年份。
        会按顺序尝试多个后端，并在结果中说明实际使用了哪一个；若有后端失败，结果会写明——覆盖不完整的搜索会被
        明确告知，而不是伪装成完整结果。
    input_schema:
      type: object
      properties:
        query:
          type: string
          description: The search query. Keep it short (3-8 words); use `site:example.com` to narrow.
          descriptions:
            zh: 搜索查询。保持简短（3-8 个词）；可用 `site:example.com` 限定域名。
        count:
          type: integer
          description: Maximum number of results to return (default 8, max 20).
          descriptions:
            zh: 最多返回的结果数（默认 8，上限 20）。
        timeout:
          type: number
          description: Per-request timeout in seconds (default 25, minimum 5).
          descriptions:
            zh: 单次请求超时秒数（默认 25，最小 5）。
      required: [query]

  # ---- web-fetch ----
  - name: web-fetch
    description: >-
      Fetch content from an HTTP or HTTPS URL and return it as text, markdown, or HTML.
      Markdown is the default. Use a more targeted tool when one is available. This tool is
      read-only. Large text results may be replaced with a preview while the complete output
      is retained in managed storage.
    descriptions:
      zh: >-
        从 HTTP 或 HTTPS URL 获取内容，以文本、markdown 或 html 返回；默认 markdown。有更精确的工具时请优先使用。本工具只读；
        过大的文本结果可能以预览返回，完整输出保留在托管存储中。
    input_schema:
      type: object
      properties:
        url:
          type: string
          description: The HTTP or HTTPS URL to fetch content from.
          descriptions:
            zh: 要获取内容的 HTTP 或 HTTPS URL。
        format:
          type: string
          enum: [text, markdown, html]
          description: The format to return the content in. Defaults to markdown.
          descriptions:
            zh: 返回内容的格式。默认 markdown。
        timeout:
          type: number
          description: Optional timeout in seconds (maximum 120).
          descriptions:
            zh: 可选超时秒数（最大 120）。
      required: [url]

  - name: image-generate
    description: >-
      Generate an image from a natural-language prompt using the configured image
      model (config `model.image`, a provider_id/model_id registered on the agent
      with capability=image). The result is stored and referenced as file:<code>.
    descriptions:
      zh: >-
        使用已配置的图像模型（配置 model.image，为 agent 上注册的 capability=image 的
        provider_id/model_id）根据自然语言提示生成图像。结果会存储为 file:<code>。
    input_schema:
      type: object
      properties:
        prompt:
          type: string
          description: The prompt that should be used to generate the image.
          descriptions:
            zh: 用于生成图像的提示词。
        size:
          type: string
          description: "Size of the image to generate (format `{width}x{height}`)."
          descriptions:
            zh: "生成图像的尺寸（格式 `{宽度}x{高度}`）。"
        n:
          type: integer
          description: Number of images to generate (default 1).
          descriptions:
            zh: 生成的图像数量（默认 1）。
      required: [prompt]
    required_config: [model.image]

  - name: image-edit
    description: >-
      Edit an image (referenced by file:<code>) using the configured image-edit
      model (config `model.image_edit`, a provider_id/model_id with
      capability=image), given a natural-language instruction. The result is
      stored and referenced as file:<code>.
    descriptions:
      zh: >-
        使用已配置的图像编辑模型（配置 model.image_edit，capability=image 的
        provider_id/model_id）编辑以 file:<code> 引用的图像，给定一条自然语言指令。
        结果会存储为 file:<code>。
    input_schema:
      type: object
      properties:
        code:
          type: string
          description: "The file code (the 16-char segment after file:) of the source image."
          descriptions:
            zh: "源图像的文件编码（file: 之后的 16 字符部分）。"
        prompt:
          type: string
          description: The edit instruction to apply to the image.
          descriptions:
            zh: 应用到图像的编辑指令。
      required: [code, prompt]
    required_config: [model.image_edit]

  - name: video-generate
    description: >-
      Generate a short video from a natural-language prompt using the configured
      video model (config `model.video`, a provider_id/model_id registered on the
      agent with capability=video, e.g. Google Veo). The result is stored and
      referenced as file:<code>.
    descriptions:
      zh: >-
        使用已配置的视频模型（配置 model.video，为 agent 上注册的 capability=video 的
        provider_id/model_id，如 Google Veo）根据自然语言提示生成短视频。结果会存储为 file:<code>。
    input_schema:
      type: object
      properties:
        prompt:
          type: string
          description: The prompt that should be used to generate the video.
          descriptions:
            zh: 用于生成视频的提示词。
        aspect_ratio:
          type: string
          enum: ['16:9', '9:16']
          description: Aspect ratio of the video (default provider-specific).
          descriptions:
            zh: 视频宽高比（默认由提供商决定）。
        resolution:
          type: string
          enum: ['720p', '1080p']
          description: Resolution of the video.
          descriptions:
            zh: 视频分辨率。
        first_frame_code:
          type: string
          description: >-
            Optional file code (the 16-char segment after file:) of an IMAGE to
            use as the video's first frame (image-to-video). Must be an image
            file — any other media type fails.
          descriptions:
            zh: >-
              可选的图片文件编码（file: 之后的 16 字符部分），作为视频首帧（图生视频）。
              必须是图片文件，其他类型会报错。
        last_frame_code:
          type: string
          description: >-
            Optional file code (the 16-char segment after file:) of an IMAGE to
            use as the video's last frame (first-last-frame generation). Must be
            an image file — any other media type fails.
          descriptions:
            zh: >-
              可选的图片文件编码（file: 之后的 16 字符部分），作为视频末帧（首末帧生成）。
              必须是图片文件，其他类型会报错。
      required: [prompt]
    required_config: [model.video]

  - name: tts-generate
    description: >-
      Synthesize speech audio from text using the configured preset-voice TTS
      model (config `model.speech`, a provider_id/model_id registered on the
      agent with capability=speech). The provider's default preset voice is
      used. The result is stored and referenced as file:<code>.
    descriptions:
      zh: >-
        使用已配置的预置音色语音合成模型（配置 model.speech，为 agent 上注册的
        capability=speech 的 provider_id/model_id）把文本合成为语音，使用提供商默认的预置音色。
        结果会存储为 file:<code>。
    input_schema:
      type: object
      properties:
        text:
          type: string
          description: The text to synthesize.
          descriptions:
            zh: 要合成为语音的文本。
      required: [text]
    required_config: [model.speech]

  - name: tts-clone
    description: >-
      Synthesize speech from text while CLONING the voice from a reference audio
      clip. Uses the configured voice-cloning TTS model (config
      `model.speech_clone`, a provider_id/model_id registered on the agent with
      capability=speech). The reference clip is a stored audio file (pass its
      file:<code>); `ref_text` is the clip's transcript when known. The result
      is stored and referenced as file:<code>.
    descriptions:
      zh: >-
        使用已配置的语音克隆模型（配置 model.speech_clone，为 agent 上注册的 capability=speech
        的 provider_id/model_id），参照一段参考音频克隆音色并把文本合成为语音。参考音频是已存储的音频文件
        （传入其 file:<code>）；ref_text 为参考音频的文本（已知时填写）。结果会存储为 file:<code>。
    input_schema:
      type: object
      properties:
        text:
          type: string
          description: The text to synthesize.
          descriptions:
            zh: 要合成为语音的文本。
        code:
          type: string
          description: "The reference audio file code (the 16-char segment after file:)."
          descriptions:
            zh: "参考音频的文件编码（file: 之后的 16 字符部分）。"
        ref_text:
          type: string
          description: Optional transcript of the reference audio clip.
          descriptions:
            zh: 可选的参考音频文本（参考音频所说内容的转写）。
      required: [text, code]
    required_config: [model.speech_clone]

  # ---- cross-session: subsession (O(1) fork child) + direct messaging ----
  - name: subsession-create
    description: >-
      Start a subsession to work on a self-contained task in the background.
      A subsession is an ordinary session forked from THIS one (zero-copy: it
      shares this conversation's history and inherits its model/preset), so
      give it a complete, self-contained prompt — it does not see this turn's
      instructions. The subsession runs in the background and will send its
      result back to this session as a new message. IMPORTANT: after calling
      this tool you MUST end your turn immediately and wait for the result —
      do NOT poll, sleep, or duplicate the subsession's work; you will be
      resumed automatically when its message arrives.
    descriptions:
      zh: >-
        启动一个 subsession 在后台处理一个自包含任务。subsession 是从本会话 fork 出的普通会话
        （零拷贝：共享本会话历史，继承其模型/预设），因此请给它一个完整、自包含的提示词——它看不到
        本轮对话中的指令。subsession 在后台运行，完成后会把结果作为一条新消息发回本会话。重要：调用
        本工具后你必须立即结束本轮，等待结果——不要轮询、不要 sleep、不要重复它的工作；结果到达时会
        自动恢复你。
    input_schema:
      type: object
      properties:
        prompt:
          type: string
          description: The complete, self-contained task for the subsession.
          descriptions:
            zh: 给 subsession 的完整、自包含任务描述。
        description:
          type: string
          description: Optional short (3-5 words) label for the task.
          descriptions:
            zh: 可选的任务短标签（3-5 个词）。
        name:
          type: string
          description: Optional explicit subsession name (default is auto-generated).
          descriptions:
            zh: 可选的显式 subsession 名称（默认自动生成）。
      required: [prompt]

  - name: mail-send
    description: >-
      Send a message to another session in the same tenant, delivered to its
      mailbox. The target resumes its turn on receipt (a user_prompt-style
      delivery), which is how a subsession hands its result back to its parent.
    descriptions:
      zh: >-
        向同租户内的另一个会话发送一条消息（投递到其 mailbox）。目标会话收到后将继续其回合
        （以 user_prompt 方式投递），subsession 正是借此把结果发回父会话。
    input_schema:
      type: object
      properties:
        to:
          type: string
          description: Target session name.
          descriptions:
            zh: 目标会话名称。
        text:
          type: string
          description: Message body to deliver.
          descriptions:
            zh: 要投递的消息内容。
      required: [to, text]

config:
  - name: search_provider
    description: >-
      Which web-search backend to use. Empty tries them in order and uses the first that answers.
      Pinning one does NOT fall back silently: if it fails, the call fails, because a caller that
      chose a specific source wants to know it did not answer.
    descriptions:
      zh: >-
        使用哪个 web-search 后端。留空则按顺序尝试、使用第一个可用的。固定某一个时不会静默回退：
        它失败就用失败，因为指定了来源的人需要知道它没有响应。
    # type: enum IS WHAT RENDERS THIS AS A DROPDOWN. As a plain `string` the console showed a text box
    # and `enum_values` was ignored — the values were in the manifest and nowhere a user could pick
    # them, so the only way to set this was to type a backend name from memory and hope it was spelled
    # the way the code expects.
    type: enum
    scope: global
    default: ''
    enum_values: [parallel, tavily, exa, firecrawl, tinyfish]
  # Model-reference knobs. `kind: model` + `capability` let the UI render a
  # picker scoped to the registered modality instead of a free-form text field
  # (no variable-name heuristics). Each knob resolves at runtime via
  # resolveGenerative(capability, value).
  - name: model.text
    description: Vision-capable TEXT model ref (provider_id/model_id) used by image-read.
    descriptions:
      zh: "image-read 使用的视觉文本模型引用（provider_id/model_id，capability=text）。"
    type: string
    kind: model
    capability: text
    scope: global
    default: ''
  - name: model.image
    description: >-
      Image model ref (provider_id/model_id, capability=image) used by
      image-generate. Register the model on the agent first.
    descriptions:
      zh: >-
        image-generate 使用的图像模型引用（provider_id/model_id，capability=image）。
        请先在 agent 上注册该模型。
    type: string
    kind: model
    capability: image
    scope: global
    default: ''
