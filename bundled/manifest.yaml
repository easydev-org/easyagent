id: bundled
version: 0.1.1
lifecycle: [deleted]

tools:
  # ---- memory / history / file / vision (from memory-extension) ----
  - name: todo-write
    # replaces the session's own todo list; nothing else depends on it
    effect: low
    description: Replace the session's todo list (stored in the database, not a file).
    descriptions:
      zh: 替换会话的待办列表（存于数据库，而非文件）。
    input_schema:
      type: object
      properties:
        todos:
          type: array
          description: The full todo list to replace the session current one.
          descriptions:
            zh: 替换会话当前列表的完整待办列表。
          items:
            type: object
            properties:
              content:
                type: string
                description: Todo item text.
                descriptions:
                  zh: 待办项文本。
              status:
                type: string
                enum: [pending, in_progress, completed, cancelled]
                description: Todo status.
                descriptions:
                  zh: 待办状态。
              priority:
                type: string
                enum: [high, medium, low]
                description: Todo priority.
                descriptions:
                  zh: 待办优先级。
            required: [content, status, priority]
      required: [todos]

  - name: history-search
    # reads the chain
    effect: none
    description: >-
      Search a conversation's chat history by keyword. Matches are case-insensitive substrings.
      WHICH CONTENT IS SEARCHED IS EXPLICIT: `include` defaults to ["text"] — the messages' own
      prose — so a long tool log cannot drown the conversational hits. Add "tool" to match tool
      names and their arguments, and "result" to match tool OUTPUT. Searches the WHOLE conversation
      (no cap), newest-first, and returns one page [offset, offset+limit). Each entry's content is
      cut to `preview_chars` (default 2000) and marked `truncated` with `full_chars`; call
      "history-read" with that entry's `seq` to get the rest.
      Pass `session` to search ANOTHER conversation in the same tenant (empty = this one).
    descriptions:
      zh: >-
        按关键词搜索会话历史（大小写不敏感子串）。搜索范围是显式的：`include` 默认 ["text"]
        （消息自身的文本），避免长工具日志淹没对话命中；加 "tool" 匹配工具名与调用参数，加 "result"
        匹配工具输出。搜索整条链（无深度上限），最新在前，返回 [offset, offset+limit) 一页。每条内容按
        `preview_chars`（默认 2000）截断并标记 `truncated` 与 `full_chars`；用该条 `seq` 调
        "history-read" 取剩余部分。传 `session` 可搜索同租户下的另一个会话（留空 = 本会话）。
    input_schema:
      type: object
      properties:
        query:
          type: string
          description: Case-insensitive keyword matched against the selected content kinds.
          descriptions:
            zh: 不区分大小写的关键词，在选定的内容类型中匹配。
        include:
          type: array
          items:
            type: string
            enum: [text, tool, result]
          description: >-
            Content kinds to search. Default ["text"]. "tool" matches tool names and call
            arguments; "result" matches tool output (often large — include it deliberately).
          descriptions:
            zh: >-
              要搜索的内容类型。默认 ["text"]。"tool" 匹配工具名与调用参数；"result" 匹配工具输出
              （通常很大，请有意地开启）。
        session:
          type: string
          description: >-
            Conversation to search. Empty = this session. Another name must exist in the same
            tenant; an unknown name is an error, not an empty result.
          descriptions:
            zh: >-
              要搜索的会话。留空 = 本会话。其他名字必须存在于同一租户；未知名字会报错而不是返回空结果。
        from:
          type: string
          description: "Inclusive lower TIME bound (YYYY-MM-DD HH:MM:SS)."
          descriptions:
            zh: "含端点的下界时间（YYYY-MM-DD HH:MM:SS）。"
        to:
          type: string
          description: "Inclusive upper TIME bound (YYYY-MM-DD HH:MM:SS)."
          descriptions:
            zh: "含端点的上界时间（YYYY-MM-DD HH:MM:SS）。"
        offset:
          type: integer
          description: >-
            Pagination offset into the match list (default 0). Pairs with `limit`; the response
            reports `has_more` and `next_offset`.
          descriptions:
            zh: 匹配结果的分页偏移（默认 0）。与 `limit` 搭配；返回 `has_more` 与 `next_offset`。
        limit:
          type: integer
          description: >-
            Page size: maximum number of matched messages to return (default 50; 0 = no page cap).
          descriptions:
            zh: 页大小：最多返回的匹配消息数（默认 50；0 = 不分页）。
        preview_chars:
          type: integer
          description: >-
            Maximum characters of content per entry (default 2000; 0 = no limit). A cut entry is
            marked `truncated` and reports `full_chars`, and history-read returns the rest.
          descriptions:
            zh: >-
              每条内容的字符上限（默认 2000；0 = 不限）。被截断的条目会标记 `truncated` 并给出
              `full_chars`，可用 history-read 取剩余内容。
        max_total_chars:
          type: integer
          description: >-
            Total budget for the rendered text (default 100000; 0 = unlimited). Entries accumulate;
            a single entry is never cut by THIS budget. `preview_chars` is the per-entry limit.
          descriptions:
            zh: >-
              text 渲染的总字符预算（默认 100000；0 = 不限）。逐条累加；单条不会被本预算截断。
              单条上限由 `preview_chars` 控制。
      required: [query]

  - name: history-range-read
    # reads the chain
    effect: none
    description: >-
      Read a conversation's history by POSITION. `from_seq`/`to_seq` bound the window by each
      message's position in the chain: the oldest message is 1 and a message's number NEVER CHANGES,
      so a position you saved last turn still addresses the same message this turn. Use `last` for
      "the most recent N" (a seq window cannot ask that without knowing the count). Returns
      oldest-first with seq, id, role, content and tool names. `preview_chars` cuts each entry
      (default 2000, 0 = no limit) and marks it `truncated`; call "history-read" with the entry's
      `seq` for the rest. The response reports `seq_min`/`seq_max` so you can page without guessing.
      Pass `session` to read another conversation in the same tenant.
    descriptions:
      zh: >-
        按位置读取会话历史。`from_seq`/`to_seq` 按消息在链中的位置限定窗口：最旧一条是 1，且一条消息的编号
        永不改变——上一轮记下的位置这一轮仍指向同一条消息。要「最近 N 条」用 `last`（seq 窗口无法在不知道
        总数的情况下表达它）。返回最旧在前，含 seq、id、角色、内容与工具名。`preview_chars` 截断每条
        （默认 2000，0 = 不限）并标记 `truncated`；用该条 `seq` 调 "history-read" 取剩余部分。返回中包含
        `seq_min`/`seq_max`，便于翻页。传 `session` 可读取同租户下的另一个会话。
    input_schema:
      type: object
      properties:
        from_seq:
          type: integer
          description: >-
            Inclusive lower bound on the message's position (oldest = 1). Omit to start at the
            beginning.
          descriptions:
            zh: 消息位置的含端点下界（最旧 = 1）。省略则从头开始。
        to_seq:
          type: integer
          description: >-
            EXCLUSIVE upper bound on position. Omit (or 0) for no upper bound.
          descriptions:
            zh: 位置的**不含端点**上界。省略（或 0）则不限上界。
        last:
          type: integer
          description: >-
            Keep only the newest N messages of the window. This is how "the most recent N" is
            expressed; a seq window cannot, because it needs the count first.
          descriptions:
            zh: 只保留窗口中最新的 N 条。这是表达「最近 N 条」的方式；seq 窗口做不到，因为它需要先知道总数。
        include:
          type: array
          items:
            type: string
            enum: [text, tool, result]
          description: >-
            Content kinds to RENDER. Default ["text"]. "tool" adds call names and arguments;
            "result" adds tool output.
          descriptions:
            zh: >-
              要渲染的内容类型。默认 ["text"]。"tool" 追加调用名与参数；"result" 追加工具输出。
        session:
          type: string
          description: Conversation to read. Empty = this session.
          descriptions:
            zh: 要读取的会话。留空 = 本会话。
        limit:
          type: integer
          description: >-
            Maximum number of messages to RETURN (default 200; 0 = no cap). Does not bound how far
            back the walk goes.
          descriptions:
            zh: 最多返回的消息数（默认 200；0 = 不限）。不限制向前回溯的范围。
        preview_chars:
          type: integer
          description: >-
            Maximum characters of content per entry (default 2000; 0 = no limit).
          descriptions:
            zh: 每条内容的字符上限（默认 2000；0 = 不限）。
        max_total_chars:
          type: integer
          description: >-
            Total budget for the rendered text (default 100000; 0 = unlimited).
          descriptions:
            zh: text 渲染的总字符预算（默认 100000；0 = 不限）。

  - name: history-read
    # reads the chain
    effect: none
    description: >-
      Return ONE message from a conversation in FULL, by its `seq` position — the number the other
      history tools print as `[seq N]`. This is the other half of the truncation they apply: when an
      entry says `truncated`, pass its seq here. `part` selects what to return — "text" (the
      message's own prose), "tool" (call names and arguments), "result" (tool output only) — and
      omitting it returns everything. Output is never truncated. Pass `session` when the seq came
      from another conversation.
    descriptions:
      zh: >-
        按 `seq` 位置返回会话中某条消息的完整内容——即其他历史工具输出里的 `[seq N]`。这是它们所做
        截断的另一半：当条目标记 `truncated` 时，把它的 seq 传进来。`part` 选择返回内容——"text"
        （消息自身文本）、"tool"（调用名与参数）、"result"（仅工具输出）——省略则返回全部。输出永不
        截断。若 seq 来自另一个会话，请传 `session`。
    input_schema:
      type: object
      properties:
        seq:
          type: integer
          description: >-
            The message's position in the conversation (oldest = 1), as printed by the other history
            tools.
          descriptions:
            zh: 消息在会话中的位置（最旧 = 1），即其他历史工具打印的值。
        part:
          type: string
          enum: [text, tool, result]
          description: >-
            Which part to return. Omit for everything.
          descriptions:
            zh: 返回哪一部分。省略则返回全部。
        session:
          type: string
          description: Conversation the seq belongs to. Empty = this session.
          descriptions:
            zh: seq 所属的会话。留空 = 本会话。
      required: [seq]

  - name: file-info
    # reads metadata
    effect: none
    description: >-
      Return metadata (name, mime type, size, sha256) for a previously uploaded file
      referenced as file:<code>. Use this first to learn a file's type and size before
      deciding to read or analyze it.
    descriptions:
      zh: >-
        返回以 file:<code> 引用的已上传文件元数据（名称、mime、大小、sha256）。先调用它以了解文件类型与大小，再决定读取或分析。
    input_schema:
      type: object
      properties:
        code:
          type: string
          description: "The file code (the 16-char segment after file:)."
          descriptions:
            zh: "文件编码（file: 之后的 16 字符部分）。"
      required: [code]

  - name: file-read
    # reads bytes
    effect: none
    description: >-
      Read the TEXT content of a previously uploaded file referenced as file:<code>,
      line-numbered, windowed by offset/limit. Only plain-text formats are supported
      (text/*, markdown, json, csv, code, …); binary files and Office documents
      (docx/xlsx/pptx) are rejected. Use file-info first to check the type.
    descriptions:
      zh: >-
        读取以 file:<code> 引用的已上传文件的文本内容，带行号，用 offset/limit 分窗。仅支持纯文本格式
        （text/*、markdown、json、csv、代码等）；二进制文件与 Office 文档（docx/xlsx/pptx）会被拒绝。先用
        file-info 查看类型。
    input_schema:
      type: object
      properties:
        code:
          type: string
          description: "The file code (the 16-char segment after file:)."
          descriptions:
            zh: "文件编码（file: 之后的 16 字符部分）。"
        offset:
          type: integer
          description: "Start line (0-based, default 0)."
          descriptions:
            zh: "起始行（从 0 开始，默认 0）。"
        limit:
          type: integer
          description: "Maximum lines to return (default 200, max 1000)."
          descriptions:
            zh: "最多返回行数（默认 200，最大 1000）。"
      required: [code]

  - name: image-read
    # reads bytes and describes them
    effect: none
    description: >-
      Understand a previously uploaded image referenced as file:<code> using a vision model.
      Pass a question (prompt); the model returns a natural-language description/answer
      about the image. The image is downscaled before sending.
    descriptions:
      zh: >-
        使用视觉模型理解以 file:<code> 引用的已上传图片。传入问题（prompt）；模型返回对图片的自然语言描述/回答。发送前会先缩小图片。
    input_schema:
      type: object
      properties:
        code:
          type: string
          description: "The file code (the 16-char segment after file:)."
          descriptions:
            zh: "文件编码（file: 之后的 16 字符部分）。"
        prompt:
          type: string
          description: "Question about the image (default: describe it in detail)."
          descriptions:
            zh: 关于图像的问题（默认：详细描述该图像）。
      required: [code]
    required_config: [model.text]

  # ---- audio-transcribe (ASR) ----
  - name: audio-transcribe
    # produces a new transcript; nothing existing changes
    effect: low
    description: >-
      Transcribe a previously uploaded audio file referenced as file:<code> to
      text, using the configured transcription model (config `model.transcription`, a
      provider_id/model_id registered on the agent with
      capability=transcription, e.g. the abcp gateway's qwen3-asr). The
      language is auto-detected.
    descriptions:
      zh: >-
        将以 file:<code> 引用的已上传音频文件转写为文字，使用已配置的转写模型（配置
        model.transcription，为 agent 上注册的 capability=transcription 的
        provider_id/model_id，如 abcp 网关的 qwen3-asr）。语言自动检测。
    input_schema:
      type: object
      properties:
        code:
          type: string
          description: "The file code (the 16-char segment after file:) of the audio file."
          descriptions:
            zh: "音频文件的文件编码（file: 之后的 16 字符部分）。"
      required: [code]
    required_config: [model.transcription]

  # ---- web-search ----
  - name: web-search
    # reads the web; nothing changes here
    effect: none
    description: >-
      Search the web and return titles, URLs and excerpts. Use this for current information beyond
      your knowledge cutoff. The current year is 2026; use this year when searching for recent
      information or current events.
    descriptions:
      zh: >-
        搜索网页并返回标题、URL 与摘要。用于获取超出知识截止时间的最新信息。当前年份为 2026，搜索近期信息或
        时事时请使用此年份。
    input_schema:
      type: object
      properties:
        query:
          type: string
          description: The search query. Keep it short (3-8 words); use `site:example.com` to narrow.
          descriptions:
            zh: 搜索查询。保持简短（3-8 个词）；可用 `site:example.com` 限定域名。
        count:
          type: integer
          description: Maximum number of results to return (default 8, max 20).
          descriptions:
            zh: 最多返回的结果数（默认 8，上限 20）。
        timeout:
          type: number
          description: Per-request timeout in seconds (default 25, minimum 5).
          descriptions:
            zh: 单次请求超时秒数（默认 25，最小 5）。
      required: [query]
    # NO PROVIDER, NO TOOL. The backend is the deployment's decision and this tool cannot run without
    # one, so the agent is never offered it until `search_provider` is set — the alternative is a tool
    # that is listed everywhere and fails on first use.
    required_config: [search_provider]

  # ---- web-fetch ----
  - name: web-fetch
    # reads a page
    effect: none
    description: >-
      Fetch content from an HTTP or HTTPS URL and return it as text, markdown, or HTML.
      Markdown is the default. Use a more targeted tool when one is available. This tool is
      read-only. Large text results may be replaced with a preview while the complete output
      is retained in managed storage.
    descriptions:
      zh: >-
        从 HTTP 或 HTTPS URL 获取内容，以文本、markdown 或 html 返回；默认 markdown。有更精确的工具时请优先使用。本工具只读；
        过大的文本结果可能以预览返回，完整输出保留在托管存储中。
    input_schema:
      type: object
      properties:
        url:
          type: string
          description: The HTTP or HTTPS URL to fetch content from.
          descriptions:
            zh: 要获取内容的 HTTP 或 HTTPS URL。
        format:
          type: string
          enum: [text, markdown, html]
          description: The format to return the content in. Defaults to markdown.
          descriptions:
            zh: 返回内容的格式。默认 markdown。
        timeout:
          type: number
          description: Optional timeout in seconds (maximum 120).
          descriptions:
            zh: 可选超时秒数（最大 120）。
      required: [url]

  - name: image-generate
    # produces a new image
    effect: low
    description: >-
      Generate an image from a natural-language prompt using the configured image
      model (config `model.image`, a provider_id/model_id registered on the agent
      with capability=image). The result is stored and referenced as file:<code>.
    descriptions:
      zh: >-
        使用已配置的图像模型（配置 model.image，为 agent 上注册的 capability=image 的
        provider_id/model_id）根据自然语言提示生成图像。结果会存储为 file:<code>。
    input_schema:
      type: object
      properties:
        prompt:
          type: string
          description: The prompt that should be used to generate the image.
          descriptions:
            zh: 用于生成图像的提示词。
        size:
          type: string
          description: "Size of the image to generate (format `{width}x{height}`)."
          descriptions:
            zh: "生成图像的尺寸（格式 `{宽度}x{高度}`）。"
        n:
          type: integer
          description: Number of images to generate (default 1).
          descriptions:
            zh: 生成的图像数量（默认 1）。
      required: [prompt]
    required_config: [model.image]

  - name: image-edit
    # produces a NEW image; the source is untouched
    effect: low
    description: >-
      Edit an image (referenced by file:<code>) using the configured image-edit
      model (config `model.image_edit`, a provider_id/model_id with
      capability=image), given a natural-language instruction. The result is
      stored and referenced as file:<code>.
    descriptions:
      zh: >-
        使用已配置的图像编辑模型（配置 model.image_edit，capability=image 的
        provider_id/model_id）编辑以 file:<code> 引用的图像，给定一条自然语言指令。
        结果会存储为 file:<code>。
    input_schema:
      type: object
      properties:
        code:
          type: string
          description: "The file code (the 16-char segment after file:) of the source image."
          descriptions:
            zh: "源图像的文件编码（file: 之后的 16 字符部分）。"
        prompt:
          type: string
          description: The edit instruction to apply to the image.
          descriptions:
            zh: 应用到图像的编辑指令。
      required: [code, prompt]
    required_config: [model.image_edit]

  - name: video-generate
    # produces a new video
    effect: low
    description: >-
      Generate a short video from a natural-language prompt using the configured
      video model (config `model.video`, a provider_id/model_id registered on the
      agent with capability=video, e.g. Google Veo). The result is stored and
      referenced as file:<code>.
    descriptions:
      zh: >-
        使用已配置的视频模型（配置 model.video，为 agent 上注册的 capability=video 的
        provider_id/model_id，如 Google Veo）根据自然语言提示生成短视频。结果会存储为 file:<code>。
    input_schema:
      type: object
      properties:
        prompt:
          type: string
          description: The prompt that should be used to generate the video.
          descriptions:
            zh: 用于生成视频的提示词。
        aspect_ratio:
          type: string
          enum: ['16:9', '9:16']
          description: Aspect ratio of the video (default provider-specific).
          descriptions:
            zh: 视频宽高比（默认由提供商决定）。
        resolution:
          type: string
          enum: ['720p', '1080p']
          description: Resolution of the video.
          descriptions:
            zh: 视频分辨率。
        first_frame_code:
          type: string
          description: >-
            Optional file code (the 16-char segment after file:) of an IMAGE to
            use as the video's first frame (image-to-video). Must be an image
            file — any other media type fails.
          descriptions:
            zh: >-
              可选的图片文件编码（file: 之后的 16 字符部分），作为视频首帧（图生视频）。
              必须是图片文件，其他类型会报错。
        last_frame_code:
          type: string
          description: >-
            Optional file code (the 16-char segment after file:) of an IMAGE to
            use as the video's last frame (first-last-frame generation). Must be
            an image file — any other media type fails.
          descriptions:
            zh: >-
              可选的图片文件编码（file: 之后的 16 字符部分），作为视频末帧（首末帧生成）。
              必须是图片文件，其他类型会报错。
      required: [prompt]
    required_config: [model.video]

  - name: tts-generate
    # produces new audio
    effect: low
    description: >-
      Synthesize speech audio from text using the configured preset-voice TTS
      model (config `model.speech`, a provider_id/model_id registered on the
      agent with capability=speech). The provider's default preset voice is
      used. The result is stored and referenced as file:<code>.
    descriptions:
      zh: >-
        使用已配置的预置音色语音合成模型（配置 model.speech，为 agent 上注册的
        capability=speech 的 provider_id/model_id）把文本合成为语音，使用提供商默认的预置音色。
        结果会存储为 file:<code>。
    input_schema:
      type: object
      properties:
        text:
          type: string
          description: The text to synthesize.
          descriptions:
            zh: 要合成为语音的文本。
      required: [text]
    required_config: [model.speech]

  - name: tts-clone
    # produces new audio; the source sample is untouched
    effect: low
    description: >-
      Synthesize speech from text while CLONING the voice from a reference audio
      clip. Uses the configured voice-cloning TTS model (config
      `model.speech_clone`, a provider_id/model_id registered on the agent with
      capability=speech). The reference clip is a stored audio file (pass its
      file:<code>); `ref_text` is the clip's transcript when known. The result
      is stored and referenced as file:<code>.
    descriptions:
      zh: >-
        使用已配置的语音克隆模型（配置 model.speech_clone，为 agent 上注册的 capability=speech
        的 provider_id/model_id），参照一段参考音频克隆音色并把文本合成为语音。参考音频是已存储的音频文件
        （传入其 file:<code>）；ref_text 为参考音频的文本（已知时填写）。结果会存储为 file:<code>。
    input_schema:
      type: object
      properties:
        text:
          type: string
          description: The text to synthesize.
          descriptions:
            zh: 要合成为语音的文本。
        code:
          type: string
          description: "The reference audio file code (the 16-char segment after file:)."
          descriptions:
            zh: "参考音频的文件编码（file: 之后的 16 字符部分）。"
        ref_text:
          type: string
          description: Optional transcript of the reference audio clip.
          descriptions:
            zh: 可选的参考音频文本（参考音频所说内容的转写）。
      required: [text, code]
    required_config: [model.speech_clone]

  # ---- cross-session: a group, its coordinator, and the workers in it ----
  - name: group-create
    # creates a group of the caller's own; no existing group changes
    effect: low
    description: >-
      Create a group with THIS session as its coordinator.

      A SESSION MAY COORDINATE ANY NUMBER OF GROUPS, so `name` is required — it is how you tell them
      apart. Each group has its OWN transcript and its own members; work for one is not visible in
      another.

      A group is how sessions talk to each other. There is no direct messaging: to give work to another
      session, put it in your group and address it with group-send.

      Requires the `group.create` permission, granted by the user.
    descriptions:
      zh: >-
        创建一个以本会话为协调者的群。

        **一个会话可以协调任意多个群**，所以 `name` 是必填的——它就是区分这些群的依据。每个群有自己的
        对话记录和成员，一个群里的工作不会出现在另一个群里。

        群是会话之间唯一的通信方式。不存在直接私信：要把工作交给另一个会话，就把它放进你的群，然后用
        group-send 点名它。

        需要用户授予 `group.create` 权限。
    input_schema:
      type: object
      properties:
        name:
          type: string
          description: >-
            Required group name, unique in this tenant. Letters, digits, '_', '-' and '.' only.
            NOT derived from the session: a session may own several groups, and "the one named after
            me" stops meaning anything past the first.
          descriptions:
            zh: >-
              必填的群名称，在本租户内唯一。只允许字母、数字、'_'、'-'、'.'。
              **不再由会话名派生**：一个会话可以有多个群，第二个开始「以我命名」就失去意义。
      required: [name]
    requires: [group.create]

  - name: spawn
    # creates a worker session; nothing existing changes
    effect: low
    description: >-
      Fork THIS session into a new worker and put it in one of your groups, then hand it a task.

      YOU MUST COORDINATE THE GROUP. Being merely a member of one is not enough: a member that could add
      sessions would be a second way in, past the person who owns the group. If you coordinate none,
      create your own with group-create first.

      `group` IS ALWAYS REQUIRED, even when you coordinate only one. A default is a decision the caller did not
      make, and the parameter would then read as optional in the tool list — the habit that breaks the first time
      there are two groups. Naming a group you do not coordinate is refused.

      THE WORKER INHERITS YOUR PERMISSIONS MINUS BOTH GROUP GRANTS. `group.create` and `group.spawn`
      are removed, so it cannot assemble a group or put other sessions to work — each level would cost a
      session nobody decided to create. Everything else it inherits, including your history, model and
      preset. Give it a complete, self-contained task: it does not see this turn's instructions.

      THE WORKER'S ID IS IN THE RESULT — address it with that id, not with the name you asked for,
      because display names are not unique.

      IMPORTANT: after calling this tool you MUST end your turn immediately and wait for the result —
      do NOT poll, sleep, or duplicate the work. You will be resumed when the worker reports back.
    descriptions:
      zh: >-
        把本会话 fork 出一个工作会话，放进**你作为协调者**的某个群，然后给它布置任务。

        **`group` 始终必填**，即使你只有一个群。默认值是一个调用方没有做出的决定，而且它会让这个参数在工具
        清单里看起来是可选的——这个习惯在出现第二个群时就会出错。填写一个你不是协调者的群会被拒绝。

        结果里会给出工作会话的 **id**——之后用 group-send 点名它时请填这个 id，而不是你请求的名称，
        因为显示名称不唯一。

        **你必须是一个群的协调者。** 仅仅作为成员是不够的：成员能往群里加人，就等于绕开了群的拥有者。若你
        还不是任何群的协调者，请先用 group-create 创建自己的群。

        **工作会话继承你的权限，但两个群权限会被移除**：`group.create` 与 `group.spawn` 都被撤销，因此它
        既不能自己建群，也不能再派生工作会话——否则每一层都会产生一个没人决定要创建的会话。其余权限照常继承，
        包括对话历史、模型与预设。请给它一个完整、自包含的任务——它看不到本轮对话的指令。

        重要：调用本工具后你必须立即结束本轮，等待结果——不要轮询、不要 sleep、不要重复它的工作。工作会话
        回报时会自动恢复你。
    input_schema:
      type: object
      properties:
        group:
          type: string
          description: >-
            Which of your groups to put the worker in. ALWAYS REQUIRED, even when you coordinate only one.
            Must be a group you coordinate.
          descriptions:
            zh: >-
              把工作会话放进你的哪个群。**始终必填**，即使你只有一个群。必须是你作为协调者的群。
        task:
          type: string
          description: The complete, self-contained task for the worker.
          descriptions:
            zh: 给工作会话的完整、自包含任务描述。
        name:
          type: string
          description: Optional explicit worker session name (default is auto-generated).
          descriptions:
            zh: 可选的工作会话名称（默认自动生成）。
        description:
          type: string
          description: Optional short (3-5 words) label for the task.
          descriptions:
            zh: 可选的任务短标签（3-5 个词）。
      required: [group, task]
    # A SEPARATE GRANT FROM group.create, because they answer different questions: "may this session
    # assemble a group" and "may it put other sessions to work". A session can legitimately have either
    # without the other — a coordinator that hands work to people rather than to agents needs no spawn.
    requires: [group.spawn]

  # ---- groups ----
  #
  # READ-ONLY, DELIBERATELY. A session can ask which groups it is in and who else is in one; it
  # cannot create, join, leave or edit a group. A group is an organisational decision a person makes,
  # and a session that could assemble one would be able to choose its own collaborators — which is a
  # view of the tenant nobody granted it.
  #
  # `group-create` ABOVE IS THE ONE EXCEPTION, and it is narrower than it looks: it creates a group whose
  # only members are the caller (as coordinator) and one worker it just forked. It cannot add anyone
  # else, and it cannot touch a group it did not create.
  # ---- groups ----
  #
  # READ-ONLY, DELIBERATELY. A session can ask which groups it is in and who else is in one; it
  # cannot create, join, leave or edit a group. A group is an organisational decision a person makes,
  # and a session that could assemble one would be able to choose its own collaborators — which is a
  # view of the tenant nobody granted it.
  - name: group-list
    # reads membership
    effect: none
    description: >-
      List the groups this session belongs to, WITH ITS ROLE IN EACH — coordinator or member.

      THE ROLE IS THE POINT. "Which groups am I in" says where you may be addressed; "which am I answerable for"
      says where work arrives and where you may spawn a worker. A list of names alone made a session discover the
      second by trying, which no longer even works reliably now that one session may coordinate several groups.

      Returns nothing for a session in no groups.
    descriptions:
      zh: >-
        列出本会话所在的群，并标出它在**每个群里的角色**——协调者还是成员。

        **角色就是重点。**「我在哪些群」说明哪里可以找到我；「我负责哪些群」说明工作从哪里来、以及我可以往
        哪里派生工作会话。只列名字会让会话靠试错去发现后者——而一个会话可以协调多个群之后，试错也不再可靠。

        不属于任何群时返回空。
    input_schema:
      type: object
      properties: {}

  - name: group-members
    # reads membership
    effect: none
    description: >-
      List the sessions in a group this session belongs to, with each one's profile: DISPLAY NAME, the
      one-line INTRO it wrote about itself, its ID, and its ROLE (coordinator or member). The coordinator
      is marked.

      This is how a session learns who else is working on the same thing, what each of them does, and who
      is answerable for the group — the three things needed to decide whom to address and with what.

      ADDRESS PEOPLE BY ID, NOT BY NAME: `group-send` takes ids, because a display name is a label two
      sessions may share. The id is shown in parentheses after each name. Returns nothing for a group it
      is not in.
    descriptions:
      zh: >-
        列出本会话所在某个群的成员，并给出每个人的资料：**显示名**、自我介绍（简介）、**id**、以及**角色**
        （协调者或成员）。协调者会被标出。

        会话借此知道还有谁在一起做同一件事、各自负责什么、以及群里的事由谁负责——也就是决定「该找谁、该交代
        什么」所需要的全部信息。

        **点名时用 id，不要用显示名**：`group-send` 收的是 id，因为显示名是不唯一的标签。每个名字后面的括号
        里就是 id。不属于该群时返回空。
    input_schema:
      type: object
      properties:
        group:
          type: string
          description: Group name.
          descriptions:
            zh: 群名称。
      required: [group]

  - name: group-send
    # adds a message to another session; nothing is replaced
    effect: low
    description: >-
      Post to a group you are in. Two different acts, decided by whether you name anyone:

      NO `to` — A REPLY TO THE GROUP. This is how a coordinator answers what was asked in the group. The
      message appears in the group's conversation, where the person who asked will read it. Nothing is
      delivered to members: a reply is for the group's reader, and waking three workers to read "收到" would
      cost three turns and produce three more replies.

      WITH `to` — AN INSTRUCTION TO THOSE MEMBERS. `to` IS AN ARRAY because "the same thing, to several
      people" is one decision: three separate calls would be three chances to write three slightly
      different texts, and the recipients would disagree about what they were told. It is NOT a broadcast —
      every name is resolved and validated, so exactly the sessions you name hear it.

      WHO MAY ADDRESS WHOM:
        coordinator → members   hand out work
        member      → coordinator   report back
      A member cannot address another member, and nobody outside the group can be reached at all.

      THE WHOLE LIST IS VALIDATED BEFORE ANYTHING IS SENT: a half-delivered instruction is worse than a
      refused one, because some workers would start on a task the others never received.

      **IF YOU WERE ASKED IN A GROUP, YOU HAVE NOT ANSWERED UNTIL YOU CALL THIS TOOL.** Your own message text
      is NOT visible in the group: it stays in your private conversation. A reader in the group sees the
      question and nothing else, which is indistinguishable from being ignored.

      This applies EVEN WHEN YOUR ANSWER IS "I cannot do it" — a blocker report is an answer, and it is the
      most important one to deliver. The most common failure is a coordinator explaining a problem in its own
      chat and never posting it.
    descriptions:
      zh: >-
        向你在的群发消息。有两种不同的动作，取决于你是否点名成员：

        **不填 `to` —— 回复群。** 这是回答「群里被问的问题」的方式。消息会出现在群的对话里，提问的人能看到。
        不会投递给任何成员：回复是给群的读者看的，唤醒三个成员来读一句「收到」要花三个回合，还各自再生一条回复。

        **填了 `to` —— 给这些成员的指令。** `to` 是**数组**，因为「同一件事交给多个人」是一个决定：拆成三次
        调用就有三次机会写出三份措辞略有不同的文本，收件人会对「自己被交代了什么」产生分歧。这**不是广播**
        ——每个名字都会被校验，因此只有你点名的会话会收到。

        **谁能发给谁**：
          协调者 → 成员    下发任务
          成员   → 协调者  上报结果
        成员之间不能对话，群外的人完全无法触达。

        **整份名单先全部校验，再开始发送**：只送达一部分比直接拒绝更糟，因为有些会话已经开工，而另一些连
        任务都没收到。

        **群里有人问了你，你不调用本工具就等于没回答。** 你自己写的那段话**不会出现在群里**——它留在你的私聊里。
        群里的人只看到问题，什么回复都没有，这和「没人理」无法区分。

        **即使你的回答是「我做不了」也必须调用。** 受阻报告本身就是回答，而且是最需要送达的那种。最常见的失败
        就是：协调者在自己会话里把问题解释得清清楚楚，却从来没发到群里。
    input_schema:
      type: object
      properties:
        group:
          type: string
          description: Group name.
          descriptions:
            zh: 群名称。
        to:
          type: array
          items:
            type: string
          description: >-
            OMIT THIS TO REPLY TO THE GROUP. When present, the member session IDs to instruct (not display
            names — names are not unique). Duplicates collapse; empty entries are dropped.
          descriptions:
            zh: >-
              **不填就是回复群。** 填了则是要下发指令的成员会话 **id**（不是显示名称——名称不唯一）。
              重复项会被合并，空项会被忽略。
        text:
          type: string
          description: >-
            Message body, the same for every recipient. MAY BE EMPTY WHEN `attachments` IS NOT: a picture with
            no caption is a message, and requiring words would make you invent a caption to send a file.
          descriptions:
            zh: >-
              消息内容，所有收件人相同。**有附件时可留空**：一张没有配文的图也是一条消息，不应该为了发文件去编一句话。
        attachments:
          type: array
          items:
            type: string
          description: >-
            FILE CODES to send with the message — the `file:<code>` id from a tool that produced a file
            (`image-generate`, `file-write`, a recording). The bytes are already stored for this tenant, so a
            code either names a real file or it names nothing. Recipients read them exactly as they read an
            attachment in a chat: a picture is a picture, a recording plays.
          descriptions:
            zh: >-
              随消息一起发送的**文件 code**——就是产生文件的工具（`image-generate`、`file-write`、录音等）返回的
              `file:<code>`。字节已经存在本租户的存储里，所以一个 code 要么指向真实文件，要么什么都不是。收件人
              的读取方式和聊天里的附件完全一致：图片就是图片，录音能直接播。
      # `to` IS NOT REQUIRED: omitting it means "reply to the group", which is the common case.
      # `text` IS NOT REQUIRED either: a message may be a file with no caption. The tool refuses only when BOTH
      # are empty, which is not a message.
      required: [group]

config:
  - name: search_provider
    description: >-
      Which web-search backend to use. REQUIRED — while it is empty the agent is not offered
      web-search at all, because the tool cannot run without a backend. One backend serves every
      call; there is no fallback chain.
    descriptions:
      zh: >-
        使用哪个 web-search 后端。**必填**——为空时 agent 根本不会看到 web-search 工具，因为没有后端
        它无法运行。每次调用只使用这一个后端，没有回退链。
    # type: enum IS WHAT RENDERS THIS AS A DROPDOWN. As a plain `string` the console showed a text box
    # and `enum_values` was ignored — the values were in the manifest and nowhere a user could pick
    # them, so the only way to set this was to type a backend name from memory and hope it was spelled
    # the way the code expects.
    type: enum
    scope: global
    # NO DEFAULT. A default would make web-search appear on a deployment that never chose a backend,
    # and then fail or silently use a source nobody picked — see required_config on the tool.
    default: ''
    enum_values: [parallel, tavily, exa, firecrawl, tinyfish]
  # Model-reference knobs. `kind: model` + `capability` let the UI render a
  # picker scoped to the registered modality instead of a free-form text field
  # (no variable-name heuristics). Each knob resolves at runtime via
  # resolveGenerative(capability, value).
  - name: model.text
    description: Vision-capable TEXT model ref (provider_id/model_id) used by image-read.
    descriptions:
      zh: "image-read 使用的视觉文本模型引用（provider_id/model_id，capability=text）。"
    type: string
    kind: model
    capability: text
    scope: global
    default: ''
  - name: model.image
    description: >-
      Image model ref (provider_id/model_id, capability=image) used by
      image-generate. Register the model on the agent first.
    descriptions:
      zh: >-
        image-generate 使用的图像模型引用（provider_id/model_id，capability=image）。
        请先在 agent 上注册该模型。
    type: string
    kind: model
    capability: image
    scope: global
    default: ''
  - name: model.image_edit
    description: >-
      Image model ref (provider_id/model_id, capability=image) used by
      image-edit. Register the model on the agent first.
    descriptions:
      zh: >-
        image-edit 使用的图像模型引用（provider_id/model_id，capability=image）。
        请先在 agent 上注册该模型。
    type: string
    kind: model
    capability: image
    scope: global
    default: ''
  - name: model.video
    description: >-
      Video model ref (provider_id/model_id, capability=video) used by
      video-generate. Register the model on the agent first.
    descriptions:
      zh: >-
        video-generate 使用的视频模型引用（provider_id/model_id，capability=video）。
        请先在 agent 上注册该模型。
    type: string
    kind: model
    capability: video
    scope: global
    default: ''
  - name: model.speech
    description: >-
      Preset-voice speech model ref (provider_id/model_id, capability=speech)
      used by tts-generate. Register the model on the agent first.
    descriptions:
      zh: >-
        tts-generate 使用的预置音色语音模型引用（provider_id/model_id，capability=speech）。
        请先在 agent 上注册该模型。
    type: string
    kind: model
    capability: speech
    scope: global
    default: ''
  - name: model.speech_clone
    description: >-
      Voice-cloning speech model ref (provider_id/model_id, capability=speech)
      used by tts-clone. Register the model on the agent first.
    descriptions:
      zh: >-
        tts-clone 使用的语音克隆模型引用（provider_id/model_id，capability=speech）。
        请先在 agent 上注册该模型。
    type: string
    kind: model
    capability: speech
    scope: global
    default: ''
  - name: model.transcription
    description: >-
      Transcription model ref (provider_id/model_id, capability=transcription)
      used by audio-transcribe. Register the model on the agent first.
    descriptions:
      zh: >-
        audio-transcribe 使用的转写模型引用（provider_id/model_id，
        capability=transcription）。请先在 agent 上注册该模型。
    type: string
    kind: model
    capability: transcription
    scope: global
    default: ''

# ---- permissions ----
#
# A group is a VISIBILITY STRUCTURE: it decides which sessions can see each other, and the
# coordinator of a group can address its members. Creating one is therefore not a routine
# bookkeeping act — it widens who can reach this session, and it is the one way a session gains
# the ability to talk to another at all. So it is granted by a person, once, per session.
permissions:
  - key: group.create
    # The label names the consequence: the session will be able to assemble sessions and address them.
    label: Create groups (and address the sessions in them)
    descriptions:
      zh: 创建群（并可向群内成员下发消息）
    # `write`, not `destructive`: nothing is deleted or overwritten. It is elevated because it
    # changes the session's reach — a session without it cannot start a conversation with another
    # session at all, which is the property this permission exists to guard.
    risk: write
  - key: group.spawn
    # The label names the consequence: the session will be able to create sessions that work for it.
    label: Spawn worker sessions (and hand them tasks in a group)
    descriptions:
      zh: 派生工作会话（并在群中向其布置任务）
    # Same tier as group.create: nothing is destroyed, but the session gains the ability to make more
    # sessions that run and spend. It is deliberately NOT implied by group.create — creating a group to
    # talk to sessions that already exist is a smaller decision than making new ones.
    risk: write
