syntax = "proto3";

// Agent API: the shared abc session backend (formerly the Hono/zod-openapi
// surface under /api/v1). The single source of truth for the agent contract.
// Server: easyagent. Clients: easybus gateway, extension servers,
// client apps (web / desktop / mobile).
package agent.v1;

import "google/protobuf/struct.proto";

option go_package = "github.com/easydev-org/easyagent/gen/agent/v1;agentv1";

// Session is a row in the agent session table.
message Session {
  /**
   * FIELD 1 WAS `name`, AND IT WAS THE IDENTITY. Both halves of that are now wrong, so the wire breaks
   * deliberately rather than quietly:
   *
   *   · the identifier is RANDOM and immutable (`id`), because it is also the address — mailbox subject,
   *     wake subject, subscription pattern, group topic. A rename used to move a session to a different
   *     subject, orphaning its queue and its group slots.
   *   · `name` is a DISPLAY LABEL: not unique, and free to change.
   *
   * A client that still sends a name where an id is expected gets NOT_FOUND, which is the honest answer
   * — there is no way to resolve one from the other, and guessing would let a display label address a
   * session.
   */
  reserved 1;

  // The session's identity and address. Random, immutable.
  string id = 30;
  // What a person calls it. Not unique, not an address, editable.
  string name = 31;
  // Canonical model reference "provider_id/model_id". A bare model id is
  // never resolved by flat lookup: the provider must be named explicitly.
  string model = 2;
  string preset = 3;
  string tip_id = 4;
  int32 max_turns = 5;
  string system_prompt = 6;
  int32 input_tokens = 7;
  int32 output_tokens = 8;
  int32 total_tokens = 9;
  int32 last_input_tokens = 10;
  int32 last_output_tokens = 11;
  string created_at = 12;
  string updated_at = 13;
  string last_used_at = 14;
  string locale = 15;
  // UI aggregates.
  string org = 16;
  string repo = 17;
  string branch = 18;
  // Number of messages the reader has NOT yet read: `message_seq - read_seq`,
  // clamped at 0. The read watermark (`read_seq`) is stored SERVER-side and is
  // SHARED across a tenant's devices (marking a session read on one device
  // clears it everywhere) — call `MarkRead` to advance it.
  int32 unread_count = 19;
  string last_message_at = 20;
  string last_message_preview = 21;
  // Selected reasoning variant id (e.g. "low"/"medium"/"high"/"max"/"fast").
  // Empty means "no variant" (provider defaults; no providerOptions sent).
  string variant = 22;
  // Monotonic per-session message counter, bumped for every appended message
  // (user/assistant/event/compaction). `unread_count` is derived from this and
  // the shared `read_seq` watermark.
  int32 message_seq = 23;
  // FIELD 24 IS RETIRED AND MUST NOT BE REUSED. It was a free-form grouping key that also recorded a
  // subsession's parent. Group membership is now the `groups` table (with roles and a coordinator), and
  // fork lineage is already in `messages.prev_id`. Reserved so a future field cannot silently inherit
  // the old meaning.
  reserved 24;
  reserved "group";
  // Runtime status, derived from the session's cross-replica run LEASE (not a
  // persisted column): "busy" while a turn holds the lease, "idle" otherwise.
  // This is the same signal the `State` RPC returns, surfaced on the list rows
  // so a list view can show which sessions are working WITHOUT polling State
  // per row. WatchSessions re-emits a row when this flips (it watches the lease
  // bucket). A session that is mid-retry (429/5xx backoff) is `busy`.
  string status = 25;
  // Why the session's LAST turn ended, read from the durable message fact:
  //   "stop"        — the model finished on its own.
  //   "interrupted" — the USER stopped it (explicit abort/delete).
  //   "locklost"    — an ENVIRONMENTAL stop (the run lost its lease, e.g. a
  //                   transient NATS/JetStream fault). Distinguishing this from
  //                   "interrupted" is what lets a supervisor auto-resume a
  //                   turn killed by infrastructure without re-running one the
  //                   user stopped. Empty when no turn has finished yet.
  string last_turn_reason = 26;
  // RFC3339 timestamp of that turn's end; empty when none has finished.
  string last_turn_at = 27;
  // Session picture, as a `file:<code>` from the agent's blob store. Empty is
  // NOT "no picture": clients render a deterministic identicon seeded by the
  // session name, which is what every session showed before this field existed.
  string avatar_file = 28;
  // One line describing WHAT THIS SESSION IS ("maintainer of repo acme/app").
  // It rides in the turn's <env> block so the model knows its own role without
  // the user restating it. NOT a system prompt: that field REPLACES the preset
  // prompt wholesale, so a role change would mean rewriting everything.
  string intro = 29;
}

// Message row (bare).
message Message {
  string id = 1;
  string role = 2;
  string prev_id = 3;
  string created_at = 4;
  repeated Part parts = 5;
  // ORIGIN of the message, when known. Empty for assistant/system rows the
  // agent authored itself. A user message carries the mailbox source it was
  // delivered with:
  //   `user`               — a human prompt (HTTP Prompt route)
  //   `session:{id}`       — another session (spawn / group-send)
  //   `system:{name}`      — a system/automation source
  //   other                — extension-defined; clients degrade gracefully
  string source = 6;
}

// A tool/text part body. `data` is the JSON/plain payload.
message Part {
  string id = 1;
  string message_id = 2;
  string type = 3;
  int32 seq = 4;
  string data = 5;
}

// Mailbox entry.
message MailboxEntry {
  string id = 1;
  string session_name = 2;
  // Message type: `trigger` (starts a turn), `interrupt`, or `event`
  // (folded into context only). Free-form on the wire.
  string msg_type = 3;
  string payload = 4;
  string effective_at = 5;
  string status = 6;
  string created_at = 7;
  string consumed_at = 8;
  int64 seq = 9;
  // ORIGIN of the message, so a consumer can tell a person's prompt from
  // another session's hand-off or a system event. Open string:
  //   `user`                 — a human prompt (HTTP Prompt route)
  //   `session:{id}`         — another session (spawn / group-send)
  //   `system:{name}`        — a system/automation source
  //   other                  — extension-defined; consumers degrade gracefully
  string source = 10;
}


// Preset row.
message Preset {
  string id = 1;
  string system_prompt = 2;
  string system_prompt_i18n = 3;
  repeated string tools = 4;
  int32 max_turns = 5;
  bool is_system = 6;
}

// Provider row. A provider serves EXACTLY ONE modality (`capability`): its
// models all share that capability. A host that serves several modalities is
// registered once per modality (semantic grouping), so a modality's model
// picker is simply "the models of that modality's providers".
message Provider {
  string provider_id = 1;
  string api_type = 2;
  string base_url = 3;
  string api_key = 4;
  map<string, string> headers = 5;
  repeated ProviderModel models = 6;
  string updated_at = 7;
  // The single modality this provider serves (text | image | video | speech |
  // transcription | embedding | rerank | realtime).
  string capability = 8;
}

// Provider model entry. All of a provider's models share the provider's
// `capability`; `model_type` mirrors it so a client can read the modality
// directly from the model.
//
//   - text      -> context_limit (> 0) REQUIRED (drives compaction budgets)
//   - non-text  -> context_limit MUST be 0 (not a chat model)
//
// A provider protocol may serve any modality its wire format supports
// (validated server-side against the capability matrix — see
// ListProvidersCatalog). There is no gateway special-casing.
message ProviderModel {
  string id = 1;
  string name = 2;
  int64 context_limit = 3;
  // The model's modality, identical to its provider's `capability`.
  string model_type = 4;
}

// Tool discovery entry.
message ToolInfo {
  string name = 1;
  string description = 2;
  string category = 3;
  google.protobuf.Struct parameters = 4;
  repeated ToolConfigField config_fields = 5;
  repeated string required_config = 6;
  /**
   * Permission keys this tool needs before it may run, as declared by its manifest.
   *
   * WITHOUT THIS THE CONSOLE CANNOT OFFER THE GRANT. The gate refuses the call regardless — it reads the
   * same declaration server-side — but a user looking at a tool that keeps failing had no way to see
   * WHAT to grant, because the requirement never left the server.
   */
  repeated string requires = 7;
  /**
   * What CALLING this tool does, independent of who may call it.
   *
   * SEPARATE FROM `requires`, which answers "does this session hold the permission". A session can be
   * fully authorised and still deserve a confirmation before merging a pull request — authorisation and
   * consequence are different questions.
   *
   *   "none"    nothing changes
   *   "low"     only the caller's own state changes; nothing others depend on
   *   "medium"  state others already depend on changes
   *   "high"    an asset is consumed; nothing to revert to
   */
  string effect = 8;
}

// Declared config knob for a tool/extension.
message ToolConfigField {
  string name = 1;
  string type = 2;
  repeated string enum_values = 3;
  google.protobuf.Value default = 6;
  string description = 7;
  string scope = 8;
  // Semantic kind: "value" (default, an ordinary knob) or "model" (the value
  // is a `provider_id/model_id` reference; the client renders a picker scoped
  // to `capability` against the provider registry instead of a text field).
  string kind = 9;
  // Required when `kind == "model"`: the modality the reference must match
  // (text | image | video | speech | transcription | embedding | rerank |
  // realtime).
  string capability = 10;
  // ---- structured knobs (type == "list" | "object") --------------------------
  //
  // fields types the SHAPE: the keys of an object, or of each list item when
  // item_type == "object". With it a client renders a real form — one card per
  // list item, a "+" to add one, a picker for an enum field — instead of a JSON
  // textarea. Empty fields means the knob is untyped and stays a json blob,
  // which is the backward-compatible behaviour for every older extension.
  repeated ConfigFieldSchema fields = 11;
  // item_type is the element type when type == "list"
  // (object | string | number | boolean).
  string item_type = 12;
  // min_items / max_items bound a list (0 = unbounded).
  int32 min_items = 13;
  int32 max_items = 14;
  // namespace scopes this knob's STORED VALUE to one namespace of the owning
  // extension. Empty = extension-level, shared by every namespace of that
  // extension (an endpoint/token knob).
  //
  // It is part of the storage address, so a client MUST round-trip it: a write
  // without it lands in a different cell than the read.
  string namespace = 15;
}

// ConfigFieldSchema is ONE key of a structured config value.
//
// It mirrors the extension protocol's message of the same name: `enum` becomes a
// picker (os -> linux|windows|macos|android), `kind: secret` a masked input,
// `format: uri` a URL field. `fields` nests one level for an object field; both
// this client and the extension stop at that depth on purpose.
message ConfigFieldSchema {
  string name = 1;
  // type: string | number | boolean | enum | json | object
  string type = 2;
  // kind: value (default) | secret (never echoed back to a client)
  string kind = 3;
  // format narrows a string: uri | host | path | email | duration | semver
  string format = 4;
  repeated string enum_values = 5;
  google.protobuf.Value default = 6;
  bool required = 7;
  string description = 8;
  map<string, string> descriptions = 9;
  repeated ConfigFieldSchema fields = 10;
}

// A tool's configured value.
message ToolConfig {
  map<string, google.protobuf.Value> values = 1;
}

// SSE-ish stream event emitted by Prompt streaming.
message PromptResponse {
  string event = 1; // status | text-delta | tool-call | tool-result | error | turn-complete
  map<string, string> params = 2;
  string eid = 3;
}

// WatchSession streams live session events (the Connect replacement for the
// SSE /stream endpoint): turn deltas, tool calls, errors and completions.
//
// Resume is by STREAM SEQUENCE, not by message id or wall-clock: every
// response carries the JetStream `seq` of the event it wraps, and a client
// that reconnects passes back the newest `seq` it saw as `since_seq`. The
// server then resumes the ordered consumer with an O(1) `by_start_sequence`
// seek — no scan, no time-based re-replay. `since_seq` unset (0) = live from
// now (or from the active run's start).
//
// A PAGE REFRESH loses the in-memory `seq` (it starts at 0 again), so it may
// pass a persistent message-id fallback anchor (`since_msg`) instead: the
// server then replays from that message's timestamp (the pre-`since_seq`
// behaviour). `since_seq` WINS when both are set — the message anchor is a
// low-frequency fallback for the refresh case only.
message WatchSessionRequest {
  string id = 1;
  // Resume anchor: the newest WatchSessionResponse.seq the client has seen.
  // 0 = live-from-now (or the active run). Replaces the former message-id
  // anchor, which forced an O(n) time-scan + full replay on every reconnect.
  int64 since_seq = 3;
  // Fallback anchor for a client that has no `seq` (e.g. a page refresh with an
  // empty in-memory `lastSeq`): a message id the client already has. The server
  // replays from that message's `created_at`. Ignored when `since_seq > 0`.
  string since_msg = 4;
}
message WatchSessionResponse {
  string event = 1;
  google.protobuf.Struct params = 2;
  string eid = 3;
  // JetStream stream sequence of this event (transport metadata). Echo the
  // newest one back as WatchSessionRequest.since_seq to resume after it.
  int64 seq = 4;
}

// WatchSessions streams the session list in real time: an initial full
// snapshot, then per-session upserts (message-fact changes, settings changes)
// and removals (deletes). Replaces list polling.
message WatchSessionsRequest {}
message WatchSessionsResponse {
  // New/updated session snapshots (message facts + settings).
  repeated Session upserts = 1;
  // Session names that were removed.
  repeated string removed = 2;
  // True for the initial full snapshot: the client replaces its whole list
  // with `upserts` (dropping anything not present) instead of merging.
  bool snapshot = 3;
  /**
   * New/updated GROUPS, on the same stream.
   *
   * A GROUP IS A CONVERSATION ROW IN THE SAME LIST, so a page that renders sessions and groups together needs one
   * stream that keeps both live. A separate watch would render the page in two steps and make it jump when the
   * second answer arrived.
   */
  repeated Group groups = 4;
  // Group names that were removed.
  repeated string removed_groups = 5;
}

// A file reference (attachment).
//
// `code` IS THE IDENTITY, and it is the only field a CALLER supplies. Name and size are advisory (a caller may
// label a upload it is about to make); mime and size are AUTHORITATIVE only when the SERVER fills them in.
message FileRef {
  string code = 1;
  string name = 2;
  int32 size = 3;
  /**
   * The content type, AS DERIVED BY THE AGENT from the bytes at ingest (magic-byte sniff + media probe).
   *
   * SERVER-FILLED, IGNORED ON INPUT. It used to be absent from this message on the reasoning that the agent
   * can always derive it — which is true, but a RENDERER has to decide between an image, a player and a file
   * chip before it can draw anything, and asking the server again for something it already knows made every
   * attachment render as a generic file. The value is not the caller's to choose; it is the agent's answer,
   * handed back so the console does not have to guess or ask twice.
   */
  string mime = 4;
}

message ListSessionsRequest {}
message ListSessionsResponse { repeated Session sessions = 1; }

message CreateSessionRequest {
  string name = 1;
  // Canonical model reference "provider_id/model_id".
  string model = 2;
  string preset = 3;
  string org = 4;
  string repo = 5;
  string branch = 6;
  // Optional reasoning variant id (see ModelInfo.variants).
  string variant = 7;
  // FIELD 8 IS RETIRED. It carried the same grouping key as `Session.group`; see the note there.
  reserved 8;
  reserved "group";
  // Session language pinned at creation ("zh" / "en"; empty = fall back to the
  // tenant default at turn time). Pinning it makes the language STABLE for the
  // session's lifetime instead of following a mutable tenant config.
  string locale = 9;
}
message CreateSessionResponse {
  bool ok = 1;
  /**
   * FIELD 2 IS RETIRED. It carried the session's ONLY identifier, which was also its display name; the
   * two are separate now, and a client that reads the old field would be holding a label it cannot
   * address anything with.
   */
  reserved 2;
  reserved "session_name";

  // The server-assigned identity. Use this for every subsequent call.
  string session_id = 3;
  /**
   * THE GROUP CREATED FOR THIS SESSION, so the console can open the room instead of the transcript.
   *
   * A caller that has to find it would list every group and match on a label — which is not unique, and is exactly
   * the lookup the id exists to remove. Empty means the group could not be created; the session is still usable.
   */
  string group_id = 4;
  // The display label the caller asked for (may be empty).
  string name = 5;
}

message GetSessionRequest { string id = 1; }
message GetSessionResponse { Session session = 1; }

message DeleteSessionRequest { string id = 1; }
message DeleteSessionResponse { bool ok = 1; }

// ListMessages reads a session's message chain. Two modes:
//   * ANCHORED / incremental: `after` is a message id ANCHOR (a pin) the
//     client already has. The response is the chain segment AFTER it, i.e. the
//     walk from the current tip back to (excluding) that anchor — the messages
//     appended since the client last synced. If the anchor is NOT on the
//     current chain (it was withdrawn via undo, or the chain was forked), the
//     response sets `resync=true` and the client must drop its cache and
//     re-fetch. `tip_id` always echoes the current tip so the client can store
//     it as the next anchor.
//   * BACKWARD paging (existing): with `before` set (and `after` empty) the
//     chain is read oldest→newest for `limit` messages BEFORE that cursor;
//     with neither set, the newest `limit` messages.
message ListMessagesRequest {
  string id = 1;
  int32 limit = 2;
  // Backward-paging cursor (exclusive): return messages before this id.
  string before = 3;
  // Incremental anchor (exclusive): return messages after this id. When the
  // anchor is absent from the current chain, the server signals `resync`.
  string after = 4;
}
message ListMessagesResponse {
  bool ok = 1;
  repeated Message messages = 2;
  // The anchor was not on the current chain (withdrawn/forked): the client
  // must discard its local copy of this session and re-fetch from scratch.
  bool resync = 3;
  // Current chain tip id (store as the next `after` anchor).
  string tip_id = 4;
}

message PromptRequest {
  string id = 1;
  string prompt = 2;
  repeated FileRef attachments = 3;
}

message ForkRequest {
  // The PARENT's id. The fork gets its own, server-assigned.
  string id = 1;
  // The fork's DISPLAY NAME. Not its identity — the server assigns a new random id, so two forks of one
  // parent can share a label.
  string name = 2;
  string message_id = 3;
  string preset = 4;
  /**
   * What the fork does with the parent's permissions.
   *
   * INHERIT is the default when this is unset, because a fork is normally "the same session, trying a
   * different approach" — stripping its capabilities would make it fail on tools that worked a moment
   * earlier, and the failure would look like a bug in the fork rather than a policy choice.
   *
   * THE FORK NEVER INHERITS GROUP MEMBERSHIP. It is a new session, not a new seat: it does not become a
   * coordinator of the parent's group (which is unique, and already taken), and joining it as a member
   * is a decision someone makes. See `ForkPermissionPolicy`.
   */
  ForkPermissionPolicy permissions = 5;
  /**
   * Capabilities to withhold when `permissions` is INHERIT_EXCEPT_SOME, as `extID/capability`.
   *
   * THE FULL PAIR, NOT A BARE KEY: two extensions may both declare `merge`, and excluding one must not
   * exclude the other. Ignored for the other two policies, which are total rather than subtractive.
   */
  repeated string exclude_capabilities = 6;
}

/**
 * How a fork treats the parent's permissions.
 *
 * These are the three answers a caller can actually want:
 *
 *   INHERIT_ALL          same session, different approach — the default.
 *   INHERIT_NONE         a clean slate, for a fork handed to someone else.
 *   INHERIT_EXCEPT_SOME  inherit, minus named capabilities. This is what `spawn` uses: everything the
 *                        worker needs to do the work, without the grants that would let it start a
 *                        branch of its own.
 */
enum ForkPermissionPolicy {
  FORK_PERMISSION_POLICY_INHERIT_ALL = 0;
  FORK_PERMISSION_POLICY_INHERIT_NONE = 1;
  FORK_PERMISSION_POLICY_INHERIT_EXCEPT_SOME = 2;
}
message ForkResponse {
  Session session = 1;
  /**
   * The group created for the fork, on the same terms as CreateSessionResponse.group_id.
   *
   * THE FORK GETS ITS OWN, it does not inherit the parent's: it is a different session that a person will direct
   * separately, and the parent's room keeps meaning what it meant.
   */
  string group_id = 2;
}

message RenameRequest { string id = 1; string name = 2; }
message RenameResponse { Session session = 1; }

message SetModelRequest { string id = 1; string model = 2; string variant = 3; }
message SetModelResponse { Session session = 1; }

message UndoRequest { string id = 1; string message_id = 2; }
message UndoResponse { Session session = 1; }

// MarkRead advances the session's SHARED read watermark (`read_seq`) to at least
// `seq` (the session's current `message_seq` when omitted/0), clearing the
// unread badge across ALL of the tenant's devices. `seq` may be supplied to
// acknowledge only up to a known point (monotonic: an older value never lowers
// the watermark). Returns the updated Session so the caller can refresh.
message MarkReadRequest { string id = 1; int32 seq = 2; }
message MarkReadResponse { Session session = 1; }

message Grant {
  // id is the handle RevokeGrant takes; stable for the life of the grant.
  string id = 1;
  string ext_id = 2;
  string capability = 3;
  // params is the JSON text whose shape the EXTENSION declared. Opaque here: the
  // agent stores and forwards it, and never reads it.
  string params = 4;
  // risk is read | write | destructive, copied from the declaration so a client can
  // warn without fetching every manifest.
  string risk = 5;
  string granted_at = 6;
  // granted_by records provenance: "user", "auto:fork:<parent>", "auto:preset:<name>".
  // A permission a user does not remember adding should say where it came from.
  string granted_by = 7;
  /**
   * scope narrows the grant to one object, `group:<id>` for the group capabilities. EMPTY MEANS EVERYWHERE.
   *
   * IT IS ON THE WIRE BECAUSE OTHERWISE THE PANEL LIES. Three rows saying `group.spawn` looked like three copies of
   * one permission, and a user could not tell which group each was for — or that granting one group did not grant
   * another.
   */
  string scope = 8;
}

message ListGrantsRequest { string id = 1; }
message ListGrantsResponse { repeated Grant grants = 1; }

/**
 * PermissionState is one capability's whole story for a session: what is held, and what was refused.
 *
 * THE TWO HALVES LIVE IN DIFFERENT STORES AND THAT IS CORRECT — a grant is permanent and belongs in the
 * relational store, a refusal is a 24-hour reminder and belongs in a TTL bucket. What was wrong was
 * making every client join them: the panel called two RPCs and matched rows by hand, and any future
 * client would have to rediscover that `granted` and `refused` are the same question asked twice.
 *
 * ONE ROW PER (extension, capability). `refused` is nil when the session holds the grant, because a
 * refusal that has been granted is cleared — a row that kept both would be describing a problem the
 * reader already fixed.
 */
message PermissionState {
  string ext_id = 1;
  string capability = 2;
  // What the session holds. Absent when the capability was only ever refused.
  Grant granted = 3;
  // What was refused in the last day, when nothing is held. Absent otherwise.
  Denial refused = 4;
}

message ListPermissionStatesRequest { string id = 1; }
message ListPermissionStatesResponse { repeated PermissionState states = 1; }

message ListDenialsRequest { string id = 1; }
message ListDenialsResponse { repeated Denial denials = 1; }

/**
 * Denial is one capability a session was refused, aggregated.
 *
 * THE SAME CAPABILITY IS ONE ROW, however many times it was refused. `count` keeps the repetition
 * legible without turning the list into a log a reader has to scan.
 */
message Denial {
  string ext_id = 1;
  // The capability key the extension declared — the thing a grant is made against.
  string capability = 2;
  // One tool that was refused for it, most recently. A reader recognises a tool name faster than a
  // capability key.
  string tool = 3;
  // Unix milliseconds. First is kept rather than advanced: "when did this start" is the question.
  int64 first_at = 4;
  int64 last_at = 5;
  int32 count = 6;
}


message CreateGrantRequest {
  string id = 1;           // session name
  string ext_id = 2;
  string capability = 3;
  // params is the JSON text for THIS instance. Empty for a boolean capability.
  string params = 4;
  string risk = 5;
  // scope narrows the grant to one object (`group:<id>`), empty for everywhere. See Grant.scope.
  string scope = 6;
}
message CreateGrantResponse { Grant grant = 1; }

message RevokeGrantRequest {
  string id = 1;           // session name
  string grant_id = 2;
}
message RevokeGrantResponse {}

// PermissionDecl is one permission a discovered extension can require.
message PermissionDecl {
  string ext_id = 1;
  string key = 2;
  string label = 3;
  map<string, string> descriptions = 4;
  // read | write | destructive. Presentation only: a client uses it to warn.
  string risk = 5;
  // params_fields types one grant's params, using the SAME schema as a config knob so a
  // client renders one form component for both.
  repeated ToolConfigField params_fields = 6;
}

message ListPermissionDeclsRequest {}
message ListPermissionDeclsResponse {
  // Ordered by extension id, then declaration order — the author's order is meaningful.
  repeated PermissionDecl decls = 1;
}

// Subscription is one channel a session follows.
message Subscription {
  // id identifies this subscription for removal.
  string id = 1;
  string channel = 2;
  // pattern is a NATS subject filter within the channel, e.g. "tag.agentdev/mrflow.>".
  string pattern = 3;
  // wake=true makes a matching message start a turn; false only lands it in the context.
  bool wake = 4;
  // system marks the built-in subscription every session has, which cannot be removed.
  bool system = 5;
}

message ListSubscriptionsRequest { string id = 1; }
message ListSubscriptionsResponse { repeated Subscription subscriptions = 1; }

message SubscribeChannelRequest {
  string id = 1;       // session name
  string channel = 2;
  string pattern = 3;
  bool wake = 4;
}
message SubscribeChannelResponse { Subscription subscription = 1; }

message UnsubscribeChannelRequest {
  string id = 1;       // session name
  string subscription_id = 2;
}
message UnsubscribeChannelResponse {}

// ChannelDecl is one channel a discovered extension publishes to.
message ChannelDecl {
  string ext_id = 1;
  string name = 2;
  string description = 3;
  map<string, string> descriptions = 4;
  repeated ChannelTopicDecl topics = 5;
}

message ChannelTopicDecl {
  // pattern documents the topic shape, e.g. "tag.<owner>/<repo>.<tag>".
  string pattern = 1;
  string description = 2;
  map<string, string> descriptions = 3;
}

message ListChannelsRequest {}
message ListChannelsResponse { repeated ChannelDecl channels = 1; }

// ---- groups ----

// Group is one named set of sessions.
//
// CREATED BY A USER, NEVER BY A SESSION OR AN EXTENSION. A group is an organisational fact about
// work — "these sessions are on the same incident" — and only the person directing that work can
// decide it. An extension that could create groups could also assemble a set of sessions and see who
// is in it, which is a view of the tenant nobody granted it.
//
// WHAT A GROUP ANSWERS: "who else is here". That is the entire contract. Messages still travel over
// channels, so a group is a DIRECTORY plus a fan-out address, not a second message store — a group
// that owned a transcript would need its own read watermarks, unread counts and "what did I miss"
// answer, all of which the session already has.
//
// NO ANNOUNCEMENT FIELD, no description, no topic: every field a group carries is one more thing a
// member reads before finding the member list. Name, picture, members.
message Group {
  /**
   * THE GROUP'S IDENTITY: random, immutable, and what every RPC below takes.
   *
   * NAME IS A LABEL. While the two were one column, renaming a group meant abandoning its transcript, its members
   * and its subscriptions, because all of them were keyed by the string that changed.
   */
  string id = 9;
  // The display label. Unique per tenant so a person can tell two groups apart; nothing routes by it.
  string name = 1;
  // `file:<code>` from the blob store. EMPTY MEANS "DERIVE ONE": the console seeds the same
  // honeycomb identicon from the name, so a group with no picture still has a stable face.
  string avatar_file = 2;
  // Provenance: whether a person or an operator's script made it. Never a session.
  string created_by = 3;
  string created_at = 4;
  int32 member_count = 5;
  /**
   * One line saying what this group is FOR — the same idea as a session's intro.
   *
   * EMPTY MEANS "SAY NOTHING". It is one line on purpose: a group's purpose is something a member reads
   * before reaching the member list, not a document that has to be kept current.
   */
  string intro = 6;
  /**
   * The newest message, for the list row — the same preview a session row shows.
   *
   * EMPTY MEANS "NOTHING WAS SAID, or the last few messages carried only files". A LIST ROW WITHOUT A PREVIEW
   * was the one way a group looked less informative than a session: it said how many people were in it and
   * never what they were talking about.
   */
  string last_message_preview = 7;
  // When that message was sent (RFC 3339). Empty when the group is empty.
  string last_message_at = 8;
}

// GroupMember is one session's membership.
//
// THE ROLE IS ABOUT MESSAGE ROUTING, NOT MANAGEMENT:
//
//   "coordinator"  RECEIVES what the user says to the group. It reads the instruction, decides how to
//                  split the work, and hands pieces to individual members with `group-send`. Exactly
//                  one per group — two would both answer the same message and talk past each other.
//   "member"       receives nothing by default. It is addressed when the coordinator names it; that
//                  is what "@" means in this design: the coordinator writes to that session's mailbox.
message GroupMember {
  string session = 1;
  // "coordinator" | "member".
  string role = 2;
  string joined_at = 3;
  // Provenance: "user" or "user:<name>". A member nobody remembers adding needs an answer.
  string joined_by = 4;
  /**
   * "busy" while a turn holds the session's run lease anywhere, "idle" otherwise.
   *
   * IT IS ON THE MEMBER ROW BECAUSE THE ROOM IS WHERE A PERSON WATCHES. "Is anyone actually working on this" is the
   * first question a group page has to answer, and answering it by opening each member's transcript in turn is not
   * an answer — it is four page loads.
   *
   * IT COMES FROM THE SHARED LEASE, not from a process's own active set: a turn runs on one replica, and a
   * process-local answer would show "idle" for working sessions on every other one.
   */
  string status = 5;
}

message CreateGroupRequest {
  // Group name. Also its address segment, so it is constrained like a session name.
  string name = 1;
  string avatar_file = 2;
  /**
   * The session that RECEIVES what the user says to the group, and hands work to the others.
   *
   * REQUIRED AND EXACTLY ONE. None means the group's messages reach nobody; two means both answer the
   * same message and their answers talk past each other. Refusing at creation is better than either
   * failure appearing the first time someone uses the group.
   */
  string coordinator = 3;
  // Additional members. They receive nothing until the coordinator addresses them.
  repeated string members = 4;
  // Recorded as the creator. Not a session name — sessions cannot create groups.
  string created_by = 5;
  // One line saying what the group is for. May be empty.
  //
  // SET AT CREATION, because that is when the person naming the group knows the answer — and a member's
  // first look at the group should not be an unexplained list of names.
  string intro = 6;
}
message CreateGroupResponse { Group group = 1; }

message ListGroupsRequest {
  // Optional filter: only the groups this session belongs to.
  //
  // A SESSION SEES ONLY ITS OWN GROUPS. There is no "list everything" for a session: enumerating
  // groups it is not in would reveal the tenant's structure, and the question a member asks is
  // always "what am I part of".
  string session = 1;
}
message ListGroupsResponse { repeated Group groups = 1; }

message GetGroupRequest {
  // THE GROUP'S ID. `name` was the identity here, which is why this field is renamed rather than reused: a caller
  // that still sends a name gets a clear not-found instead of a group it did not mean.
  string id = 1;
  // The asking session. Empty means "a user is asking" (console, admin) and skips the membership
  // check. A session that names itself must be a member, and a non-member gets NOT_FOUND — the same
  // answer as a group that does not exist, because distinguishing them would let any session
  // enumerate the tenant's groups by watching which names return a different error.
  string session = 2;
}
message GetGroupResponse {
  Group group = 1;
  repeated GroupMember members = 2;
}

message UpdateGroupRequest {
  string id = 1;
  /**
   * A NEW DISPLAY NAME, or absent to keep the current one.
   *
   * `optional` because '' is not a legal name but "leave it alone" must be expressible — and because before the
   * identity split a rename could not be offered at all.
   */
  optional string name = 4;
  // `optional`, like a session's own avatar: absent = leave alone, present-but-empty = clear.
  optional string avatar_file = 2;
  // Same rule: absent = leave it alone, present-but-empty = clear it.
  optional string intro = 3;
}
message UpdateGroupResponse { Group group = 1; }

message DeleteGroupRequest { string id = 1; }
message DeleteGroupResponse {}

message AddGroupMemberRequest {
  string group_id = 1;
  repeated string members = 2;
  string added_by = 3;
}

// SetGroupCoordinator moves the role to another existing member.
message SetGroupCoordinatorRequest {
  string group_id = 1;
  // Must already be a member: promoting a stranger would add it to the group as a side effect of
  // naming it, which is the opposite of what an explicit member list is for.
  string session = 2;
}
message SetGroupCoordinatorResponse {
  Group group = 1;
  repeated GroupMember members = 2;
}
message AddGroupMemberResponse {
  Group group = 1;
  repeated GroupMember members = 2;
}

message RemoveGroupMemberRequest {
  string group_id = 1;
  string member = 2;
}
message RemoveGroupMemberResponse {
  Group group = 1;
  repeated GroupMember members = 2;
}

/**
 * One message in a group's transcript.
 *
 * A GROUP HAS ITS OWN TRANSCRIPT. It is not an index over member sessions: a member that joins later can
 * read what was said before it arrived, a reader can follow the conversation without opening every
 * session, and a message outlives the departure of everyone who saw it.
 */
message GroupMessage {
  string id = 1;
  // The group's id (its identity). The display name is on the Group itself.
  string group_id = 2;
  // The group's name AT THE TIME OF SENDING would be wrong to freeze; this is the current one, for display.
  string group_name = 9;
  // The sending session's ID, or EMPTY when a user posted it through the console.
  string sender = 3;
  // The sender's display name at the time of sending; survives a later rename so the transcript reads as
  // it did.
  string sender_name = 4;
  string body = 5;
  // Position within this group, starting at 1, strictly increasing. The resume cursor for WatchGroup.
  int64 seq = 6;
  string created_at = 7;
  /**
   * Files posted with the message — a picture, a voice note, a document.
   *
   * THE BYTES ARE NOT HERE. `code` names a blob the tenant already stores, the same reference a session
   * message uses, so one upload is readable by every member instead of being copied per message.
   */
  repeated FileRef attachments = 8;
}

message SendGroupMessageRequest {
  string group_id = 1;
  /**
   * The message body. MAY BE EMPTY WHEN `attachments` IS NOT: a photo with no caption is a message, and
   * requiring text for it would make the user invent words to send a picture.
   */
  string text = 2;
  /**
   * The sending session's ID, or empty for a user.
   *
   * IT IS CHECKED AGAINST MEMBERSHIP. A session that is not in the group cannot post to it, which keeps the
   * transcript from accepting messages from anyone who guesses the name.
   */
  string sender = 3;
  // FIELD 4 WAS `to`, AND IT IS GONE. A message posted through this RPC has exactly one recipient, decided by
  // the sender's role: a user's message and a member's report both reach the COORDINATOR, and a coordinator
  // addresses members through its own `group-send` tool rather than through the console's RPC. Reserved so a
  // future field cannot silently inherit the meaning.
  reserved 4;
  reserved "to";
  /**
   * Files to attach, already uploaded by the console. A code names a tenant blob, so posting it grants no
   * access the uploader did not already have.
   */
  repeated FileRef attachments = 6;
}
message SendGroupMessageResponse {
  // The message as stored, including the sequence it was assigned.
  GroupMessage message = 1;
  // The sessions it was delivered to. A user's message goes to the COORDINATOR only; a coordinator's goes
  // to the addressed member. Returned as a list so the answer stays truthful if the routing rule changes.
  repeated string delivered_to = 2;
}

message ListGroupMessagesRequest {
  string group_id = 1;
  // EXCLUSIVE cursor: return messages with seq GREATER than this. 0 starts from the beginning.
  int64 after_seq = 2;
  // Page size; 0 means the server default.
  int32 limit = 3;
  // The asking session. When set, it must be a member — a non-member gets NOT_FOUND, not an empty page.
  string session = 4;
}
message ListGroupMessagesResponse {
  repeated GroupMessage messages = 1;
  // The group's current highest seq, so a client can start a watch from here without a second call.
  int64 latest_seq = 2;
}

/**
 * WatchGroup streams a group's transcript as it grows.
 *
 * `since_seq` is the RESUME CURSOR, not a filter: the server first sends the retained messages after it and
 * then follows live. Unlike WatchSession it does not reimplement replay — the messages are in a table, so
 * "everything after N" is a query and the live part is a notification.
 */
message WatchGroupRequest {
  string group_id = 1;
  // Send messages with seq GREATER than this first, then follow live. 0 = from the beginning.
  int64 since_seq = 2;
  // The asking session. When set, it must be a member.
  string session = 3;
}
message WatchGroupResponse {
  // "ready" once the stream is open, then "message" per GroupMessage.
  string event = 1;
  GroupMessage message = 2;
  // The group's highest seq when the stream opened; a client that started at 0 and only wants live traffic
  // can jump here.
  int64 latest_seq = 3;
}

message StateRequest { string id = 1; }
message StateResponse { google.protobuf.Struct state = 1; }

// Mailbox listing is NEWEST-FIRST and paged BACKWARD (older) for infinite
// scroll: the client holds the newest page and passes the oldest entry it has
// as `before` to fetch the next-older page.
message MailboxRequest {
  string id = 1;
  // Max entries to return (0 => server default).
  int32 limit = 2;
  // Backward cursor (exclusive): return entries OLDER than this entry id.
  // Empty => the newest page.
  string before = 3;
}
message MailboxResponse {
  bool ok = 1;
  repeated MailboxEntry mailbox = 2;
  // True when more (older) entries exist beyond this page.
  bool has_more = 3;
}

message UpdateSettingsRequest {
  string id = 1;
  /**
   * The session's model. `optional` so "no model" is expressible: absent = leave it alone, present-but-empty =
   * clear it. The column stores NULL for "absent", because a session may exist before its model is chosen and ''
   * would make "not chosen" indistinguishable from "chosen, with a blank id".
   */
  optional string model = 2;
  string preset = 3;
  string locale = 4;
  /**
   * Selected reasoning variant id. `optional` so "clear it" is expressible: absent = leave it alone,
   * present-but-empty = go back to the default. Without that, choosing "default" after choosing "high" was a
   * change the server could not receive — the field simply did not travel.
   */
  optional string variant = 5;
  // `optional` IS THE POINT: proto3 cannot tell an absent string from an empty one, and these two
  // need both meanings. Absent = leave the value alone; present-but-empty = CLEAR it, which is how a
  // session goes back to the derived identicon or to saying nothing about itself.
  optional string avatar_file = 6;
  optional string intro = 7;
  /**
   * The session's DISPLAY NAME — the same field `Rename` sets, reachable here so one save covers the
   * whole profile page.
   *
   * `optional` for the same reason as the two above: absent = leave it alone, present-but-empty = clear
   * it. Clearing is legal and means "show the id instead", which is what a session with no label looks
   * like.
   */
  optional string name = 8;
}
message UpdateSettingsResponse { Session session = 1; }

message InterruptRequest { string id = 1; }
message InterruptResponse { bool ok = 1; bool interrupted = 2; }

message CompactRequest { string id = 1; }
message CompactResponse { bool ok = 1; }

message ListProvidersRequest {}
message ListProvidersResponse { repeated Provider providers = 1; }

message ListProvidersCatalogRequest {}
// The registration catalog: every provider api type the server accepts and
// the model capabilities each can serve. Single source of truth for client
// registration forms — clients fetch this instead of hardcoding the matrix
// (with a bundled fallback copy for offline use).
message ListProvidersCatalogResponse {
  // api type id (e.g. "openai-compatible") -> its catalog entry.
  map<string, ApiTypeCatalog> api_types = 1;
}
// Catalog entry for one provider api type.
message ApiTypeCatalog {
  // Capability tags a model of this api type may declare in `model_type`
  // (text | image | video | speech | transcription | embedding | rerank).
  repeated string capabilities = 1;
}

message RegisterProviderRequest { Provider provider = 1; }
message RegisterProviderResponse { bool ok = 1; }

message DeleteProviderRequest { string provider_id = 1; }
message DeleteProviderResponse { bool ok = 1; }

message TestProviderRequest {
  string provider_id = 1;
  string api_type = 2;
  string base_url = 3;
  string api_key = 4;
  // The model to exercise: a bare id or a `provider_id/model_id` reference. The server strips the
  // prefix, because the gateway only knows the bare id.
  string model = 5;
  // Optional reasoning variant id to exercise in the test generation.
  string variant = 6;
  /**
   * The modality to exercise: text | image | video | speech | transcription.
   *
   * EACH ONE HAS ITS OWN CALL, because a chat completion cannot test a TTS model. The server routes
   * on this value; empty means text.
   */
  string capability = 7;
  // The prompt: a question for text, the prompt for image/video, the words for speech.
  string prompt = 8;
  // Recorded audio for transcription, base64. Ignored by the other modalities.
  string audio = 9;
  // The recording's media type, e.g. "audio/webm". Transcription only.
  string audio_media_type = 10;
  // Voice for speech synthesis: empty for a preset-voice model, or a `data:` URL for cloning.
  string voice = 11;
}
message TestProviderResponse {
  bool ok = 1;
  // Text the caller should show as-is: the reply, the transcript, or the error.
  string result = 2;
  /**
   * Produced media, for the modalities that generate a file rather than text.
   *
   * ONE LIST RATHER THAN ONE FIELD PER MODALITY: the caller renders whatever comes back by its
   * `media_type`, which is also what makes an image-EDIT that returns several images work without a
   * second shape.
   */
  repeated GeneratedFile files = 3;
}

// GeneratedFile is one produced artifact: an image, a clip, a spoken line.
message GeneratedFile {
  string media_type = 1;
  bytes data = 2;
}

// ListModels returns the models of ONE provider. provider_id is required: the
// server rejects an empty value (InvalidArgument) so a global flat model list
// — which would surface duplicate ids across providers — is never produced.
message ListModelsRequest { string provider_id = 1; }
message ListModelsResponse { repeated ModelInfo models = 1; }
message ModelInfo {
  string id = 1;
  string name = 2;
  // Reasoning variants offered by this model (from the models.dev catalog).
  // Empty when the model has no reasoning options or is not in the catalog.
  repeated ModelVariant variants = 3;
  // Context window (tokens) configured for this provider model.
  int64 context_limit = 4;
}

// A selectable reasoning variant for a model (e.g. low/medium/high/max, or a
// fast mode). `id` is passed back on CreateSession/SetModel/UpdateSettings.
message ModelVariant {
  string id = 1;
  string name = 2;
  string description = 3;
}

// ListPresets lists presets. When locale is set (e.g. "zh"), each preset's
// system_prompt is resolved from its i18n map for that locale, falling back
// to the default prompt.
message ListPresetsRequest { string locale = 1; }
message ListPresetsResponse { repeated Preset presets = 1; }

message UpsertPresetRequest { Preset preset = 1; }
message UpsertPresetResponse { bool ok = 1; }

message DeletePresetRequest { string id = 1; }
message DeletePresetResponse { bool ok = 1; }

message PreviewPresetRequest { string id = 1; }
message PreviewPresetResponse { string template = 1; string rendered = 2; }

message GetConfigRequest { string key = 1; }
message GetConfigResponse { string key = 1; string value = 2; }

message SetConfigRequest { string key = 1; string value = 2; }
message SetConfigResponse { bool ok = 1; }

message ListToolsRequest { string locale = 1; }
message ListToolsResponse { repeated ToolInfo tools = 1; }

message GetToolConfigRequest {}
message GetToolConfigResponse { ToolConfig config = 1; }

message SetToolConfigRequest { google.protobuf.Struct config = 1; }
message SetToolConfigResponse { bool ok = 1; }

message SetExtensionConfigRequest { string ext_id = 1; string name = 2; google.protobuf.Value value = 3; }
message SetExtensionConfigResponse { bool ok = 1; }

// ExtensionInfo describes one discovered extension's WHOLE config surface (not
// per-tool). A tool's `config_fields` is only the subset it requires; this is
// every knob the extension declares.
message ExtensionInfo {
  string ext_id = 1;
  string version = 2;
  repeated string capabilities = 3;
  repeated ToolConfigField config_fields = 4;
  // The tool names this extension provides.
  repeated string tools = 5;
  // namespaces declares the grouping this extension uses for its tools and
  // config (pvc, build, storage, ...). Purely descriptive: a client uses it to
  // lay the groups out in a stable order and to label them.
  repeated ExtensionNamespace namespaces = 6;
  // tools_detailed carries each tool WITH its namespace, so a client can group
  // them. `tools` above stays for clients that only need the names.
  repeated ExtensionToolInfo tools_detailed = 7;
}

// ExtensionNamespace is one declared grouping of an extension's surface.
message ExtensionNamespace {
  string name = 1;
  string description = 2;
  map<string, string> descriptions = 3;
}

// ExtensionToolInfo is one tool plus the namespace it belongs to.
message ExtensionToolInfo {
  string name = 1;
  // namespace is empty when the tool is not grouped.
  string namespace = 2;
  string description = 3;
}

message ListExtensionsRequest {}
message ListExtensionsResponse { repeated ExtensionInfo extensions = 1; }

// GetExtensionConfig returns the configured value for each of an extension's
// declared knobs (a `{knob: value}` map).
message GetExtensionConfigRequest { string ext_id = 1; }
message GetExtensionConfigResponse {
  // Values for ordinary knobs. A knob declared `kind == "secret"` is NEVER
  // present here — its value is withheld by the server.
  map<string, google.protobuf.Value> values = 1;
  // Names of the `kind == "secret"` knobs that currently have a value set.
  // The client renders "set" (with a replace/clear action) vs "not set",
  // without ever seeing the credential.
  repeated string secret_set = 2;
}

message UploadFileRequest { FileRef file = 1; string data = 2; }
// `mime` is the SERVER-DERIVED content type of the stored file (see
// IngestFileResponse); the caller never supplies one.
message UploadFileResponse { bool ok = 1; string code = 2; string mime = 3; }

message IngestFileRequest {
  string code = 1; // optional; empty => server mints one
  bytes data = 2;
  string name = 3;
}
// `mime` is the content type the agent DERIVED from the bytes (magic-byte
// sniff, with an ffprobe refinement for media). It is authoritative: clients
// render from it rather than asserting their own guess.
message IngestFileResponse { bool ok = 1; string code = 2; string mime = 3; }

message GetFileRequest { string code = 1; }
message GetFileResponse { bytes data = 1; string name = 2; string mime = 3; }

message GetFileMetaRequest { string code = 1; }
// File metadata: identity + server-derived media facts. The optional media
// fields are populated (asynchronously, best-effort) by the agent's media
// probe when the mime is a supported image/video/audio type; they are absent
// (field presence unset) for files that are not media or were probed before
// the feature existed. `thumb_code` is itself a canonical file code (the
// thumbnail is a content-addressed file), so a client fetches it through the
// normal GetFile/GetFileStream path.
message GetFileMetaResponse {
  string name = 1;
  string mime = 2;
  int32 size = 3;
  optional int32 width = 4;
  optional int32 height = 5;
  optional int64 duration_ms = 6;
  optional string thumb_code = 7;
  optional string thumbhash = 8;
}

// GetFileStream streams a file's bytes in order (chunk by chunk). It is the
// streaming counterpart of GetFile: small files still round-trip fine, while
// large media is delivered progressively so a client can start rendering
// before the whole object has arrived. Without a `Range` API this is a
// forward-only stream (no seek); `offset` is the byte offset of `data` in the
// file and `total` its full length, so a client can compute progress.
message FileChunk {
  bytes data = 1;
  uint64 offset = 2;
  uint64 total = 3;
  bool last = 4;
}



message GetAgentConfigRequest {}
message GetAgentConfigResponse { google.protobuf.Struct config = 1; }

message HealthRequest {}
message HealthResponse { bool ok = 1; string name = 2; }

// GetIdentity returns the caller's resolved identity (from its bearer token).
// The webui uses it to show a human username instead of the (fixed, same-
// origin) URL. A tenant token can only ever resolve its own identity; an admin
// token resolves role=admin with empty tenant fields.
message GetIdentityRequest {}
message GetIdentityResponse {
  string tenant = 1;
  // Human-readable tenant name (defaults to the id when unset).
  string tenant_name = 2;
  // "tenant" | "admin".
  string role = 3;
  // Admin scope: "*" (the platform admin) or a subtree root id (a delegated
  // admin). Empty for a tenant.
  string scope = 4;
}

// AgentService is the session-backend API.
service AgentService {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc GetIdentity(GetIdentityRequest) returns (GetIdentityResponse);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);
  rpc DeleteSession(DeleteSessionRequest) returns (DeleteSessionResponse);
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse);
  rpc Prompt(PromptRequest) returns (stream PromptResponse);
  rpc WatchSession(WatchSessionRequest) returns (stream WatchSessionResponse);
  rpc WatchSessions(WatchSessionsRequest) returns (stream WatchSessionsResponse);
  rpc Fork(ForkRequest) returns (ForkResponse);
  rpc Rename(RenameRequest) returns (RenameResponse);
  rpc SetModel(SetModelRequest) returns (SetModelResponse);
  rpc Undo(UndoRequest) returns (UndoResponse);
  rpc MarkRead(MarkReadRequest) returns (MarkReadResponse);

  // ── session permissions ──────────────────────────────────────────────────
  //
  // A session's authorisations. An extension declares what it can require
  // (PermissionDecl in its manifest); these RPCs record which of those a particular
  // session holds.
  //
  // `params` is OPAQUE: its shape is whatever the extension declared, and neither the
  // agent nor this API interprets it. A session may hold several grants of the same
  // capability with different params — "merge in this repository" and "merge in that
  // one" are two authorisations, not one.
  rpc ListGrants(ListGrantsRequest) returns (ListGrantsResponse);

  /**
   * ListPermissionStates returns what a session holds AND what it was refused, already joined.
   *
   * THE JOIN BELONGS HERE, NOT IN EVERY CLIENT. A grant is permanent and lives in the relational store;
   * a refusal is a 24-hour reminder and lives in a TTL bucket. That split is right. What was wrong was
   * that the panel called two RPCs and matched rows by (extension, capability) itself — and any second
   * client would have to rediscover that the two are one question asked twice.
   */
  rpc ListPermissionStates(ListPermissionStatesRequest) returns (ListPermissionStatesResponse);

  /**
   * ListDenials reports the capabilities this session was REFUSED in the last day.
   *
   * A REFUSAL IS CORRECT AND INVISIBLE TO THE PERSON WHO COULD FIX IT. The model reads the error at
   * the moment it happens; the person reads the panel minutes later, with the refusal several tool
   * calls back. This is the list that turns "I cannot do that" into a button.
   *
   * IT IS A REMINDER, NOT A LOG: entries aggregate by capability, and they expire after a day. A list
   * that keeps complaining about something already granted teaches the reader that it is noise.
   */
  rpc ListDenials(ListDenialsRequest) returns (ListDenialsResponse);

  rpc CreateGrant(CreateGrantRequest) returns (CreateGrantResponse);
  rpc RevokeGrant(RevokeGrantRequest) returns (RevokeGrantResponse);
  // ListPermissionDecls publishes what the discovered extensions can require.
  //
  // A client needs this to render a grant form: the params shape comes from the
  // extension, not from the console. Without it a UI could only offer permissions it was
  // hard-coded to know about.
  rpc ListPermissionDecls(ListPermissionDeclsRequest) returns (ListPermissionDeclsResponse);

  // ── channel subscriptions ────────────────────────────────────────────────
  //
  // What a session LISTENS TO. A subscription is (channel, pattern, wake): the pattern is a
  // NATS subject filter within the channel, and wake decides whether a matching message
  // starts a turn or only lands in the session's context.
  //
  // Every session carries a built-in subscription to `session-channel.<its name>.>` which
  // cannot be removed: that is how anything reaches a session by name.
  rpc ListSubscriptions(ListSubscriptionsRequest) returns (ListSubscriptionsResponse);
  rpc SubscribeChannel(SubscribeChannelRequest) returns (SubscribeChannelResponse);
  rpc UnsubscribeChannel(UnsubscribeChannelRequest) returns (UnsubscribeChannelResponse);
  // ListChannels publishes which channels the discovered extensions publish to, so a client
  // can offer "follow this repository's tags" instead of asking for a pattern.
  rpc ListChannels(ListChannelsRequest) returns (ListChannelsResponse);

  // ---- groups ----
  //
  // A group is a NAMED SET OF SESSIONS THAT CAN SEE EACH OTHER. It answers one question — "who else
  // is here" — and nothing else: the messages themselves still travel over channels, so a group is a
  // directory plus a fan-out address rather than a second message store.
  //
  // MEMBERSHIP IS THE ONLY PERMISSION. Every call below requires the caller's session to be IN the
  // group; a non-member gets NOT_FOUND rather than PERMISSION_DENIED, because distinguishing the two
  // would let any session enumerate every group in the tenant.
  rpc CreateGroup(CreateGroupRequest) returns (CreateGroupResponse);
  rpc ListGroups(ListGroupsRequest) returns (ListGroupsResponse);
  rpc GetGroup(GetGroupRequest) returns (GetGroupResponse);
  rpc UpdateGroup(UpdateGroupRequest) returns (UpdateGroupResponse);
  rpc DeleteGroup(DeleteGroupRequest) returns (DeleteGroupResponse);
  rpc AddGroupMember(AddGroupMemberRequest) returns (AddGroupMemberResponse);
  rpc RemoveGroupMember(RemoveGroupMemberRequest) returns (RemoveGroupMemberResponse);
  rpc SetGroupCoordinator(SetGroupCoordinatorRequest) returns (SetGroupCoordinatorResponse);

  // Send a message FROM A USER to a group. It is delivered to the COORDINATOR only; the coordinator
  // decides how to split the work and addresses members itself with `group-send`. "@" in this design
  // means "the coordinator writes to that session's mailbox", not a string this layer parses.
  rpc SendGroupMessage(SendGroupMessageRequest) returns (SendGroupMessageResponse);
  // A group's transcript, oldest first, paged by `after_seq`.
  rpc ListGroupMessages(ListGroupMessagesRequest) returns (ListGroupMessagesResponse);
  // Live transcript: retained messages after `since_seq`, then everything new.
  rpc WatchGroup(WatchGroupRequest) returns (stream WatchGroupResponse);
  rpc State(StateRequest) returns (StateResponse);
  rpc Mailbox(MailboxRequest) returns (MailboxResponse);
  rpc UpdateSettings(UpdateSettingsRequest) returns (UpdateSettingsResponse);
  rpc Interrupt(InterruptRequest) returns (InterruptResponse);
  rpc Compact(CompactRequest) returns (CompactResponse);
  rpc ListProviders(ListProvidersRequest) returns (ListProvidersResponse);
  rpc ListProvidersCatalog(ListProvidersCatalogRequest) returns (ListProvidersCatalogResponse);
  rpc RegisterProvider(RegisterProviderRequest) returns (RegisterProviderResponse);
  rpc DeleteProvider(DeleteProviderRequest) returns (DeleteProviderResponse);
  rpc TestProvider(TestProviderRequest) returns (TestProviderResponse);
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
  rpc ListPresets(ListPresetsRequest) returns (ListPresetsResponse);
  rpc UpsertPreset(UpsertPresetRequest) returns (UpsertPresetResponse);
  rpc DeletePreset(DeletePresetRequest) returns (DeletePresetResponse);
  rpc PreviewPreset(PreviewPresetRequest) returns (PreviewPresetResponse);
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);
  rpc SetConfig(SetConfigRequest) returns (SetConfigResponse);
  rpc ListTools(ListToolsRequest) returns (ListToolsResponse);
  rpc GetToolConfig(GetToolConfigRequest) returns (GetToolConfigResponse);
  rpc SetToolConfig(SetToolConfigRequest) returns (SetToolConfigResponse);
  rpc SetExtensionConfig(SetExtensionConfigRequest) returns (SetExtensionConfigResponse);
  rpc ListExtensions(ListExtensionsRequest) returns (ListExtensionsResponse);
  rpc GetExtensionConfig(GetExtensionConfigRequest) returns (GetExtensionConfigResponse);
  rpc UploadFile(UploadFileRequest) returns (UploadFileResponse);
  rpc IngestFile(IngestFileRequest) returns (IngestFileResponse);
  rpc GetFile(GetFileRequest) returns (GetFileResponse);
  rpc GetFileMeta(GetFileMetaRequest) returns (GetFileMetaResponse);
  rpc GetFileStream(GetFileRequest) returns (stream FileChunk);
  rpc GetAgentConfig(GetAgentConfigRequest) returns (GetAgentConfigResponse);
}

// ---------------------------------------------------------------------------
// Admin API: tenant + tenant-token lifecycle. Served by the agent behind a
// static admin bearer token (AGENT_ADMIN_TOKEN). Kept SEPARATE from
// AgentService so a tenant token can never reach it.
// ---------------------------------------------------------------------------

// Tenant is one isolation domain. `id` is the plaintext isolation key used on
// the wire (abc.<id>.<...>) and in the database.
message Tenant {
  string id = 1;
  string name = 2;
  // A disabled tenant's tokens stop authenticating (fail-closed); its data is
  // retained. Re-enable by clearing this flag.
  bool disabled = 3;
  string created_at = 4;
  string updated_at = 5;
  // Delegation: the parent tenant that created this one (empty = a platform
  // root), and the subtree root this tenant belongs to (its own id if a root).
  string parent_id = 6;
  string scope_id = 7;
}

// AdminToken is a DELEGATED administrator credential, scoped to a subtree root.
// The plaintext is returned ONLY at create time; the server stores just sha256.
message AdminToken {
  string token_id = 1;
  // The subtree root this admin may manage.
  string scope_tenant_id = 2;
  string label = 3;
  string created_at = 4;
  string last_used_at = 5;
  bool revoked = 6;
}

// TenantToken is a bearer credential minted for one tenant. The plaintext is
// returned ONLY at issue/rotate time; the server stores just its sha256.
message TenantToken {
  string token_id = 1;
  string tenant_id = 2;
  string label = 3;
  string created_at = 4;
  string last_used_at = 5;
  bool revoked = 6;
}

message ListTenantsRequest {}
message ListTenantsResponse { repeated Tenant tenants = 1; }

message CreateTenantRequest {
  // Plaintext tenant id: ^[A-Za-z0-9_-]{1,64}$. A delegated admin must leave
  // this empty (the id is SERVER-GENERATED under the caller's scope); a
  // platform admin may supply it, or leave it empty to have one generated.
  string id = 1;
  string name = 2;
  // Optional: create the tenant UNDER this parent (a user inside a domain).
  // A platform admin may target any parent; a delegated admin may only target
  // its own scope. Empty = a subtree root (a new domain).
  string parent_id = 3;
}
message CreateTenantResponse {
  Tenant tenant = 1;
  // The bootstrap token minted for the new tenant (plaintext, shown once).
  string token = 2;
}

message UpdateTenantRequest {
  string id = 1;
  optional string name = 2;
  optional bool disabled = 3;
}
message UpdateTenantResponse { Tenant tenant = 1; }

message DeleteTenantRequest {
  string id = 1;
}
message DeleteTenantResponse { bool ok = 1; }

message IssueTenantTokenRequest {
  string tenant_id = 1;
  string label = 2;
}
message IssueTenantTokenResponse {
  TenantToken token = 1;
  // The plaintext token (shown once; never retrievable again).
  string plaintext = 2;
}

message ListTenantTokensRequest { string tenant_id = 1; }
message ListTenantTokensResponse { repeated TenantToken tokens = 1; }

message RevokeTenantTokenRequest { string token_id = 1; }
message RevokeTenantTokenResponse { bool ok = 1; }

// SetTenantTokenLabel renames a tenant token (its display label). The token id
// (and secret) are unchanged.
message SetTenantTokenLabelRequest {
  string token_id = 1;
  string label = 2;
}
message SetTenantTokenLabelResponse { TenantToken token = 1; }

message RotateTenantTokenRequest { string token_id = 1; }
message RotateTenantTokenResponse {
  TenantToken token = 1;
  // The new plaintext token (shown once).
  string plaintext = 2;
}

// AdminService manages tenants and their tokens. All RPCs require the static
// admin bearer token and are never reachable with a tenant token.
service AdminService {
  rpc ListTenants(ListTenantsRequest) returns (ListTenantsResponse);
  rpc CreateTenant(CreateTenantRequest) returns (CreateTenantResponse);
  rpc UpdateTenant(UpdateTenantRequest) returns (UpdateTenantResponse);
  rpc DeleteTenant(DeleteTenantRequest) returns (DeleteTenantResponse);
  rpc IssueTenantToken(IssueTenantTokenRequest) returns (IssueTenantTokenResponse);
  rpc ListTenantTokens(ListTenantTokensRequest) returns (ListTenantTokensResponse);
  rpc RevokeTenantToken(RevokeTenantTokenRequest) returns (RevokeTenantTokenResponse);
  rpc RotateTenantToken(RotateTenantTokenRequest) returns (RotateTenantTokenResponse);
  rpc SetTenantTokenLabel(SetTenantTokenLabelRequest) returns (SetTenantTokenLabelResponse);

  // Login verifies a (username, token) pair and returns the caller's role +
  // scope. The admin username is the configured platform admin name; a tenant
  // username is the tenant id. Exempt from bearer auth (the pair IS the auth).
  rpc Login(LoginRequest) returns (LoginResponse);

  // Delegated administrators (re-delegation): a platform admin may create an
  // admin token for ANY subtree; a delegated admin only within its OWN subtree.
  rpc CreateAdminToken(CreateAdminTokenRequest) returns (CreateAdminTokenResponse);
  rpc ListAdminTokens(ListAdminTokensRequest) returns (ListAdminTokensResponse);
  rpc RevokeAdminToken(RevokeAdminTokenRequest) returns (RevokeAdminTokenResponse);
}

message LoginRequest {
  string username = 1;
  string token = 2;
}
message LoginResponse {
  // "admin" | "tenant".
  string role = 1;
  // Admin scope ("*" or a subtree root); empty for a tenant.
  string scope = 2;
  // The resolved tenant id (empty for an admin).
  string tenant = 3;
  // Human-readable tenant name.
  string tenant_name = 4;
  // session_token is the credential to present on every SUBSEQUENT call
  // ("Authorization: Bearer <session_token>").
  //
  // The username+token PAIR is exchanged here once, and only once. Why:
  //   * the pair's secret may be a short, human-chosen label, and presenting it
  //     on every RPC would send a guessable string constantly;
  //   * this token is random and GLOBALLY UNIQUE, so the per-call middleware can
  //     resolve a caller from the token alone — no username, and no ambiguity
  //     when two tenants happen to pick the same label.
  // It is null when the caller used the static platform admin token (that
  // credential is presented directly, as before).
  string session_token = 5;
}

message CreateAdminTokenRequest {
  // The subtree root the new admin may manage. A delegated caller may only
  // pass its own scope; the platform admin may pass any tenant.
  string scope_tenant_id = 1;
  string label = 2;
}
message CreateAdminTokenResponse {
  AdminToken token = 1;
  // The plaintext admin token (shown once).
  string plaintext = 2;
}
message ListAdminTokensRequest {
  // The subtree root to list. A delegated caller may only list its own scope.
  string scope_tenant_id = 1;
}
message ListAdminTokensResponse { repeated AdminToken tokens = 1; }
message RevokeAdminTokenRequest { string token_id = 1; }
message RevokeAdminTokenResponse { bool ok = 1; }
